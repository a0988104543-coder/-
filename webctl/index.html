<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>官網控制台・永樂翫青行</title>
<style>
/* 控制台是工作工具：清楚、好按、手機能用。色調跟官網一致（暖灰米），但不追求展示感。 */
:root{
  --bg:#f2f0ec; --card:#fbfaf7; --ink:#2b2724; --muted:#857f78; --faint:#b9b3ab; --line:#e1ddd6;
  --accent:#8f2a1e; --accent-soft:#f3e4e1; --ok:#2f6b3a; --ok-soft:#e3efe5; --warn:#9a6a12; --warn-soft:#f6ecd8;
  --radius:8px; color-scheme:light;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo{background:#2b2724;color:#efe9e1;font-size:12px;text-align:center;padding:6px 16px}

/* 頁首 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);transition:transform .25s ease}
/* 往下滑收起、往上撥滑出（2026-11-24 Daniel：照典藏資料庫瀏覽頁的手感） */
.top.hid{transform:translateY(calc(-100% - env(safe-area-inset-top,0px)))}
.ctlbox{position:sticky;top:calc(var(--hdrH,0px) + env(safe-area-inset-top,0px));z-index:12;background:var(--bg);transition:transform .25s ease,box-shadow .2s}
.ctlbox.stuck{box-shadow:0 6px 12px -8px rgba(0,0,0,.18)}
.ctlbox.hid{transform:translateY(calc(-100% - var(--hdrH,0px) - env(safe-area-inset-top,0px)))}
.items-ctl{padding-top:4px;margin-bottom:12px}
.items-ctl .toolbar{margin-bottom:0;padding-bottom:10px}
.shop .ctlbox{margin-inline:-32px;padding:10px 32px 4px;margin-top:-26px}
.shop .ctlbox .toolrow{margin-top:0}
@media (max-width:720px){.shop .ctlbox{margin-inline:-14px;padding-inline:14px}}
/* 回頂部 */
.totop{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:25;width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:18px;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,bottom .2s}
.totop.show{opacity:.85;pointer-events:auto}
.totop:hover{opacity:1}
body.has-batch .totop{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.bar{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:.08em}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
.spacer{flex:1}
.pending{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:3px 10px;border-radius:99px}
.pending.none{color:var(--ok);background:var(--ok-soft)}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:var(--radius);min-height:36px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.small{padding:3px 10px;min-height:30px;font-size:13px}
.tabs{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

main{max-width:1120px;margin:0 auto;padding:16px 16px 120px}
.hint{font-size:12px;color:var(--muted);margin:0 0 12px}

/* 篩選 */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:13px;min-height:32px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:7px 10px}

/* 藏品列 */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:28px 64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.row.dragging{opacity:.4}
.row.over{border-color:var(--accent)}
.thumb{width:64px;height:64px;border-radius:6px;background:#e7e3dc;object-fit:cover;display:block}
.noimg{width:64px;height:64px;border-radius:6px;background:#e7e3dc;display:grid;place-items:center;font-size:11px;color:var(--faint)}
.info{min-width:0}
.info .pub-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .pub-name.empty{color:var(--faint);font-weight:400}
.info .internal{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.flag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.flag.ok{background:var(--ok-soft);color:var(--ok)}
.ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
select.st{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 6px;min-height:32px}

/* 公開開關 */
.sw{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;min-height:32px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .track{width:38px;height:22px;border-radius:99px;background:#d6d1c9;position:relative;transition:background .2s}
.sw .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.sw input:checked+.track{background:var(--ok)}
.sw input:checked+.track::after{left:19px}
.sw input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}

/* 批次列（挑選模式時出現，手機也能用） */
.batch{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:15;width:min(1088px,calc(100% - 24px));display:none;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:var(--radius);padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.batch.on{display:flex}
.batch .btn{background:transparent;color:#fff;border-color:#5a534d}

/* 挑選藏品：照典藏資料庫的照片卡片牆 */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .count{font-size:12px;color:var(--muted)}
.chip .n{opacity:.6;margin-left:4px;font-size:12px}
/* 卡片尺寸照典藏資料庫（約 190px 寬）；螢幕越寬一排越多張，不放大卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,190px));gap:12px;justify-content:start}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card2 .meta{padding:6px 8px 8px}
.card2 .nm{font-size:13px}
.card2{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.card2:hover{border-color:var(--faint)}
.card2 .pic{aspect-ratio:3/4;background:#e7e3dc;display:grid;place-items:center;color:var(--faint);font-size:12px}
.card2 .pic img{width:100%;height:100%;object-fit:cover;display:block}
.card2 .meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.card2 .no{font-size:11px;color:var(--muted)}
.card2 .nm{font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card2 .nm.empty{color:var(--faint)}
.badge{position:absolute;top:8px;left:8px;font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(43,39,36,.78);color:#fff}
.badge.pub{background:var(--ok)}
/* 系列標籤：卡片右下，列出這件屬於哪些系列（2026-11-19 Daniel） */
.card2 .meta{flex:1}
.stags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;margin-top:auto;padding-top:6px}
.stag{font-size:11px;line-height:1.5;padding:0 7px;border-radius:99px;border:1px solid var(--line);background:#f2f0ec;color:var(--muted)}
.badge2{position:absolute;top:8px;right:8px;font-size:11px;padding:2px 8px;border-radius:99px;background:#fff;color:var(--ink);border:1px solid var(--line)}
.card2 .flags{margin-top:4px}
.card2.sel{outline:3px solid var(--accent);outline-offset:-3px}
.tick{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);display:grid;place-items:center;color:#fff;font-size:13px}
.card2.sel .tick{background:var(--accent);border-color:var(--accent)}
.pubrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:16px}

/* 排序：拖曳為主（左邊把手，電腦和手機都能拖），箭頭為輔（右邊小按鈕） */
.ord .row{grid-template-columns:44px 28px 64px minmax(0,1fr) auto}
.ordnum{font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.grip{width:44px;height:44px;display:grid;place-items:center;border-radius:6px;color:var(--muted);font-size:22px;
  cursor:grab;user-select:none;touch-action:none;border:0;background:none}
.grip:hover{background:#ebe7e0;color:var(--ink)}
.row.lifting{box-shadow:0 6px 18px rgba(0,0,0,.12);border-color:var(--ink);position:relative;z-index:2}
body.dragging-row,body.dragging-row *{cursor:grabbing!important;user-select:none}
.mv{display:flex;gap:2px}
.mv .btn{min-width:30px;min-height:30px;padding:0 6px;font-size:12px;color:var(--muted);background:transparent;border-color:transparent}
.mv .btn:hover:not(:disabled){border-color:var(--line);color:var(--ink)}
.mv .btn:disabled{opacity:.3}

/* 編輯抽屜 */
.scrim{position:fixed;inset:0;background:rgba(30,26,22,.35);z-index:30;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:31;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbody{flex:1;overflow:auto;padding:16px}
.dfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg)}
fieldset{border:0;padding:0;margin:0 0 20px}
legend{font-weight:600;margin-bottom:8px;font-size:13px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:12px;color:var(--muted)}
.f input,.f textarea,.f select{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 9px}
.f textarea{min-height:90px;resize:vertical}
.ref{font-size:12px;color:var(--muted);background:#ebe7e0;border-radius:6px;padding:8px 10px;margin-bottom:12px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;border:2px solid transparent;border-radius:6px;padding:0;background:none}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block;opacity:.55}
.ph[aria-pressed="true"]{border-color:var(--ok)}
.ph[aria-pressed="true"] img{opacity:1}
.ph .n{position:absolute;top:4px;left:4px;background:var(--ok);color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
/* 官網照片：勾選的可拖曳排序，下面有 ‹ › 給手機用 */
.phw{display:flex;flex-direction:column;gap:4px;border-radius:8px}
.phw.on{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.phw.lifting{transform:scale(1.05);background:var(--bg);cursor:grabbing}
.phw .ph{width:100%}
.phbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.phbar.pick{background:var(--ok-soft);border:1px solid var(--ok);border-radius:var(--radius);padding:8px 10px;font-size:13px}
.phbar.pick b{color:var(--ok)}
.phbar .spacer{flex:1}
.ph.pk img{opacity:.6}
.ph.pk.on{border-color:var(--ok)}
.ph.pk.on img{opacity:1}
.ph .ck{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:5px;border:2px solid #fff;background:rgba(0,0,0,.3);color:#fff;display:grid;place-items:center;font-size:13px}
.ph.pk.on .ck{background:var(--ok);border-color:var(--ok)}
.phw.on .ph{border-color:transparent}
.phw.on .ph img{opacity:1}
.phw.cur .ph{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
.phtools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* 官網照片放大檢視（2026-11-24 Daniel：挑照片時要能放大看）：每張小圖右下角 🔍 */
.phz{position:relative}
.phz .ph{width:100%}
.zb{position:absolute;right:5px;bottom:5px;z-index:2;width:30px;height:30px;border-radius:50%;border:0;background:rgba(43,39,36,.72);color:#fff;display:grid;place-items:center;padding:0;cursor:zoom-in}
.zb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.zb:hover{background:var(--ink)}
.pv{position:fixed;inset:0;z-index:60;background:rgba(24,21,18,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:56px 56px 84px}
.pv.on{display:flex}
.pv img{max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-select:none;
  transform-origin:0 0;will-change:transform;touch-action:none;cursor:zoom-in;-webkit-user-drag:none}
.pv.zoomed img{cursor:grab}
.pv.panning img{cursor:grabbing}
.pv .pvbar .zm{display:inline-flex;align-items:center;gap:4px}
.pv .pvbar .zm button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.pv .pvbar .zm span{min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums}
.pv .pvhint{color:#8a847d;font-size:12px}
@media (max-width:720px){.pv .pvhint{display:none}}
.pv .pvx,.pv .pvp,.pv .pvn{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:44px;height:44px;border-radius:50%;font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer}
.pv .pvx{top:max(12px,env(safe-area-inset-top,0px));right:12px}
.pv .pvp{left:8px;top:50%;transform:translateY(-50%)}
.pv .pvn{right:8px;top:50%;transform:translateY(-50%)}
.pv .pvbar{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:14px;color:#efe9e1;font-size:13px}
.pv .pvbar{left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);flex-wrap:wrap;background:rgba(24,21,18,.82);border-radius:99px;padding:6px 8px 6px 16px;z-index:2}
.pv .pvx,.pv .pvp,.pv .pvn{z-index:2}
.pv .pvbar .btn{background:#fff;color:var(--ink);border-color:#fff}
.pv .pvbar .btn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pv .pvload{position:absolute;color:#b9b3ab;font-size:13px}
@media (max-width:720px){.pv{padding:56px 8px 84px}.pv .pvp,.pv .pvn{top:auto;bottom:max(10px,env(safe-area-inset-bottom,0px));transform:none}}
.phtools .btn:disabled{opacity:.35}
.cutout{display:flex;align-items:center;gap:10px;font-size:13px}
.cutout img{width:72px;height:72px;object-fit:contain;background:#f2f0ec;border:1px solid var(--line);border-radius:6px}
.groups label{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}

/* 官網陳列：照官網藏品頁的樣子（淺米底、一排三件、照片＋品名＋時代、SOLD 黑白） */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.seg button{border:0;background:var(--card);padding:5px 14px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.shop{background:#f2f0ec;border:1px solid var(--line);border-radius:var(--radius);padding:40px 32px 56px;
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
.shop-head{text-align:center;margin-bottom:28px;letter-spacing:.3em;font-size:16px}
.shop-filters{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:36px}
.shop-filters .r{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 26px}
.shop-filters button{border:0;background:none;font:inherit;font-size:14px;color:var(--muted);padding:0 0 3px;border-bottom:1px solid transparent;cursor:pointer}
.shop-filters .r.sub button{font-size:13px}
.shop-filters button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.shop-filters .cnt{font-size:11px;color:var(--faint);letter-spacing:.16em}
/* 分類就地編輯（官網陳列的分類列） */
.catbar{display:flex;justify-content:flex-end;margin:-20px 0 8px}
.shop-filters.editing .r{gap:6px 10px}
.shop-filters.editing .cc{display:inline-flex;align-items:center;gap:2px;border:1px dashed var(--faint);border-radius:99px;padding:2px 10px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:#f7f5f1}
.shop-filters.editing .cc[aria-pressed="true"]{border-style:solid;border-color:var(--ink)}
.shop-filters.editing .cc.off{opacity:.45}
.shop-filters.editing .cc.lifting{box-shadow:0 6px 16px rgba(0,0,0,.15);cursor:grabbing}
.shop-filters .add{font-size:13px;color:var(--accent);border:1px dashed var(--accent);border-radius:99px;padding:2px 10px}
.shop-filters input.inl{font:inherit;font-size:13px;border:1px solid var(--ink);border-radius:99px;padding:2px 10px;width:9em;background:#fff}
.ctool{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;font-family:system-ui,sans-serif;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px;margin-top:4px}
.ctool b{font-weight:600}
.ctool .btn{min-height:30px;padding:2px 10px;font-size:12px}
.ctool select{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px;max-width:14em}
.seriesChips{display:inline-flex;flex-wrap:wrap;gap:4px 26px;align-items:center}
.shop-filters.editing .seriesChips{gap:6px 10px}
.sepbar{color:var(--line);margin:0 2px}
.shop-filters .stoggle{color:var(--muted)}
/* 控制台：搜尋縮小、靠右，跟編輯按鈕同一排，不擋在標題和分類中間 */
.toolrow{align-self:stretch;display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:-16px 0 12px;font-family:system-ui,sans-serif}
.shopq{font-family:system-ui,sans-serif;font-size:12px;border:1px solid var(--line);background:#fbfaf7;border-radius:99px;padding:4px 12px;width:9em;transition:width .2s}
.shopq:focus{width:min(16em,50vw);outline:none;border-color:var(--ink)}
.tick2{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.28);color:#fff;display:grid;place-items:center;font-size:14px;font-family:system-ui,sans-serif;z-index:2}
.tick2.on{background:var(--ok);border-color:var(--ok)}
.scard .rm{position:absolute;top:6px;right:6px;font-family:system-ui,sans-serif;font-size:11px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:1px 8px;cursor:pointer}

<!-- 登入：第一次在這台裝置使用時輸入後端網址和通行碼，記在這台裝置（跟典藏資料庫的做法一樣） -->
<div class="login" id="login" hidden>
  <form class="lbox" id="loginForm">
    <h1>官網控制台</h1>
    <p class="hint">第一次在這台裝置使用，請輸入後端網址和通行碼。輸入一次就會記住，按右上角「登出」可以清除。</p>
    <div class="f"><label for="lgUrl">後端網址</label><input id="lgUrl" type="url" required placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false"></div>
    <div class="f"><label for="lgPass">通行碼</label><input id="lgPass" type="password" autocomplete="current-password"></div>
    <p class="lerr" id="lgErr" role="alert"></p>
    <button class="btn primary" type="submit" id="lgBtn">登入</button>

<script>
// ── 資料（2026-11-24 第 4 步之①起接真資料）：登入後從後端 action=webData 一次讀進來。
//    第 4 步之②起自動存檔：改完約 1.5 秒，把「跟上次存檔時不一樣」的部分一次送回（action=webSaveAll）。
const CATS={CQ:"陶瓷",ZH:"字畫",YQ:"玉器",ZX:"雜項"};
// 典藏資料庫的細分類（各品項 S 欄整理出來）。控制台只用來找東西，不在這裡改
let SUBCATS={CQ:[],ZH:[],YQ:[],ZX:[]};
let ITEM_SUBS={};
// 典藏資料庫的內部欄位（只讀）：「從典藏資料庫帶入」用
let INNER={};
// 照片（2026-11-24 第 4 步之③）：官網照片用 Drive 檔案 ID 記在「官網照片」欄（逗號分隔，順序＝官網顯示順序，第一張是主圖）。
// 用 ID 不用檔名：典藏資料庫重排照片會改檔名，ID 不會變。打開某件時才向後端（action=images，典藏資料庫原有功能）讀全部照片。
let COVER={};
const P=(no,n)=>n===1?(COVER[no]||""):"";
const driveThumb=(id,w=800)=>`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
// 典藏封面小圖網址裡的檔案 ID（批次設成公開、還沒選照片時，拿封面當主圖用）
const coverId=no=>{const m=/[?&]id=([A-Za-z0-9_-]+)/.exec(COVER[no]||"");return m?m[1]:"";};
// 列表、首頁用的主圖：有去背用去背，沒有就用你選的第一張，再沒有就用典藏封面
// 去背主圖欄（AG）的值（2026-11-26）：空白＝還沒處理；「待辦」；「主圖」＝背景本來就乾淨、直接用第一張；「失敗」＝做不了、列表用原圖；其餘＝去背圖的 Drive 檔案 ID。
// 發布程式只把檔案 ID 當去背圖，「主圖」「失敗」一律改用第一張照片，所以後端不用改。
const BG_MARKS=["主圖","失敗"];
const bgState=v=>{v=String(v||"");const mk=BG_MARKS.includes(v)?v:"", id=v&&v!=="待辦"&&!mk?v:"";
  return {bg:id?driveThumb(id):"",bgId:id,bgq:v==="待辦",bgMark:mk};};
const bgValue=i=>i.bgq?"待辦":(i.bgId||i.bgMark||"");
function setBg(i,v){Object.assign(i,bgState(v));}
const mainImg=i=>i?(i.bg||(i.sel.length?driveThumb(i.sel[0]):(COVER[i.no]||""))):"";

let CATALOGUES=[], ABOUT=[], ENQ={intro:"",items:[]};
// 存檔用：DATA＝上次從後端讀到（或存檔後補上）的原始資料，也是記在這台裝置的那份；SNAP＝上次存檔時的樣子；VERS＝小表的版本指紋

let HOME={feature:""};

// 把後端的資料轉成畫面用的格式
const isOn=v=>v==="TRUE";
const splitList=v=>String(v||"").split(",").map(s=>s.trim()).filter(Boolean);
const bySort=(a,b)=>(a.sort===""?-1:+a.sort)-(b.sort===""?-1:+b.sort);   // 沒排過的放最前面
function loadData(d){
  DATA=d; VERS={...(d.vers||{})};
  SUBCATS={CQ:[],ZH:[],YQ:[],ZX:[]}; ITEM_SUBS={}; INNER={}; COVER={};
  ITEMS=d.items.map(r=>{
    const w=r.web||{};
    INNER[r.id]={date:r.dynasty,kiln:r.kiln,size:r.size,hasDesc:!!r.hasDesc};   // 簡述全文按「帶入」時才讀
    if(r.coverThumb)COVER[r.id]=r.coverThumb;
    if(r.subs&&r.subs.length){ITEM_SUBS[r.id]=r.subs;r.subs.forEach(s=>{if(SUBCATS[r.cat]&&!SUBCATS[r.cat].includes(s))SUBCATS[r.cat].push(s);});}
    return {no:r.id,cat:r.cat,name:r.name,status:r.status,folderId:r.folderId,photos:r.coverThumb?1:0,
      raw:{...w},   // 試算表上目前的值（存檔時拿來確認沒被別的裝置改過）
      ...bgState(w.bg),
      pub:isOn(w.pub),st:w.st||"",code:w.code||"",sort:w.sort||"",
      out:{zh:w.zh||"",en:w.en||"",date:w.date||"",kiln:w.kiln||"",size:w.size||"",src:w.src||"",essay:w.essay||"",essayEn:w.essayEn||""},
      sel:splitList(w.photos),mainAuto:isOn(w.mainAuto),groups:[]};
  });
  ORDER=ITEMS.filter(i=>i.pub&&i.code).sort(bySort).map(i=>i.code);
  GROUPS=(d.groups||[]).map(g=>({id:g.id,type:g.type,cat:g.cat,zh:g.zh,en:g.en,from:g.from,to:g.to,place:g.place,
    intro:g.intro,introEn:g.introEn,cover:g.cover,updatedAt:g.updatedAt,members:splitList(g.members),pub:isOn(g.pub),sort:g.sort||""})).sort(bySort);
  GROUPS.forEach(g=>g.members.forEach(c=>{const i=ITEMS.find(x=>x.code===c);if(i)i.groups.push(g.id);}));
  CATTREE=(d.cats||[]).map(c=>({id:c.id,name:c.name,en:c.en,parent:"",show:isOn(c.show),src:splitList(c.src),members:[],sort:c.sort||""})).sort(bySort);
  syncTops();
  const pg=t=>(d.pages||[]).filter(p=>p.type===t).sort(bySort);
  CATALOGUES=pg("圖錄").map(p=>({id:p.id,title:p.title,en:p.en,date:p.date,pages:"",pdf:false,pub:isOn(p.show)}));
  ABOUT=pg("關於").map(p=>({id:p.id,h:p.title,b:p.body}));
  ENQ={intro:(d.settings&&d.settings.enqIntro)||"",items:pg("詢問").map(p=>({id:p.id,label:p.title,value:p.body,show:isOn(p.show)}))};
  HOME={feature:(d.settings&&d.settings.feature)||""};

// ── 自動存檔（2026-11-24 第 4 步之②）
// 做法：把畫面上的資料轉成「試算表的樣子」，跟上次存檔時（SNAP）比，只送不一樣的部分。
// 品項只送改過的欄位，並附上原值；小表整張送，附上版本指紋。別的裝置先改過的話，後端整批不存。
const tf=v=>v?"TRUE":"", str=v=>v==null?"":String(v);
const ITEM_KEYS=["pub","st","sort","code","zh","en","date","kiln","size","src","essay","essayEn","photos","bg","mainAuto"];
function itemWeb(i){
  const pos=i.pub&&i.code?ORDER.indexOf(i.code):-1;
  return {pub:tf(i.pub),st:i.st||"",sort:pos>=0?String(pos+1):str(i.raw.sort),code:i.code||"",
    zh:i.out.zh,en:i.out.en,date:i.out.date,kiln:i.out.kiln,size:i.out.size,src:i.out.src,essay:i.out.essay,essayEn:i.out.essayEn,
    photos:i.sel.join(","),bg:bgValue(i),mainAuto:tf(i.mainAuto)};
}
const catRows=()=>CATTREE.map((c,k)=>({id:c.id,name:str(c.name),en:str(c.en),src:(c.src||[]).join(","),show:tf(c.show),sort:String(k+1)}));
const groupRows=()=>GROUPS.map((g,k)=>({id:g.id,type:str(g.type),zh:str(g.zh),en:str(g.en),from:str(g.from),to:str(g.to),place:str(g.place),
  intro:str(g.intro),introEn:str(g.introEn),cover:str(g.cover),members:g.members.join(","),pub:tf(g.pub),updatedAt:str(g.updatedAt),cat:str(g.cat),sort:String(k+1)}));
function pageRows(){
  const row=(type,k,o)=>({id:o.id,type,title:"",en:"",body:"",date:"",show:"",sort:String(k+1),...o});
  return [...CATALOGUES.map((c,k)=>row("圖錄",k,{id:c.id,title:str(c.title),en:str(c.en),date:str(c.date),show:tf(c.pub)})),
    ...ABOUT.map((a,k)=>row("關於",k,{id:a.id,title:str(a.h),body:str(a.b),show:"TRUE"})),
    ...ENQ.items.map((e,k)=>row("詢問",k,{id:e.id,title:str(e.label),body:str(e.value),show:tf(e.show)}))];
}
const settingVals=()=>({feature:str(HOME.feature),enqIntro:str(ENQ.intro)});
function snapshot(){
  const items={}; ITEMS.forEach(i=>items[i.no]=itemWeb(i));
  return {items,cats:JSON.stringify(catRows()),groups:JSON.stringify(groupRows()),pages:JSON.stringify(pageRows()),settings:settingVals()};
}
// 這次要送的東西；沒有變動就回傳 null
function buildSave(){
  const save={}, next={items:{}};
  const items=[];
  ITEMS.forEach(i=>{const now=itemWeb(i), was=SNAP.items[i.no]||{}, web={}, old={};
    ITEM_KEYS.forEach(k=>{if(now[k]!==was[k]){web[k]=now[k];old[k]=str(i.raw[k]);}});
    if(Object.keys(web).length){items.push({id:i.no,web,old});next.items[i.no]=now;}});
  if(items.length)save.items=items;
  [["cats",catRows],["groups",groupRows],["pages",pageRows]].forEach(([k,fn])=>{const rows=fn(),j=JSON.stringify(rows);
    if(j!==SNAP[k]){save[k]={rows,base:VERS[k]};next[k]=j;}});
  const sv=settingVals(), values={}, old={};
  Object.keys(sv).forEach(k=>{if(sv[k]!==SNAP.settings[k]){values[k]=sv[k];old[k]=str((DATA.settings||{})[k]);}});
  if(Object.keys(values).length){save.settings={values,old};next.settings=sv;}
  return Object.keys(save).length?{save,next}:null;
}
// 存好之後：記下新的樣子，也把記在這台裝置的資料補成最新，下次打開就不會是舊的
function afterSave(job,res){
  const {save,next}=job;
  (save.items||[]).forEach(u=>{const i=byNo(u.id); Object.assign(i.raw,u.web); Object.assign(SNAP.items[u.id],next.items[u.id]);
    const r=DATA.items.find(x=>x.id===u.id); if(r)r.web={...(r.web||{}),...u.web};});
  ["cats","groups","pages"].forEach(k=>{if(save[k]){SNAP[k]=next[k];DATA[k]=save[k].rows;VERS[k]=res.vers[k];}});
  DATA.vers={...VERS};
  if(save.settings){SNAP.settings={...SNAP.settings,...save.settings.values};DATA.settings={...(DATA.settings||{}),...save.settings.values};}
  saveCache(DATA);
}
let saveTimer=null, saving=false, saveState="", needRefresh=false;
const isDirty=()=>!!(SNAP&&buildSave());
function scheduleSave(){ if(saveState==="conflict")return; clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,1500); setSync("有修改，準備存檔…","busy"); }
async function saveNow(){
  clearTimeout(saveTimer);
  if(saving||saveState==="conflict")return;
  if(!SNAP){ setSync("資料還沒讀好，修改暫時不會存","bad"); return; }
  const job=buildSave();
  if(!job){ setSync(`已存檔（${hhmm(Date.now())}）`); afterIdle(); return; }
  saving=true; setSync("儲存中…","busy");
  try{
    let r;
    try{ r=await fetch(localStorage.getItem(LS_URL),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"webSaveAll",k:localStorage.getItem(LS_PASS)||"",save:job.save})}); }
    catch(e){ throw new Error("連不上後端"); }
    let d; try{ d=await r.json(); }catch(e){ throw new Error("後端的回應看不懂"); }
    if(!d.ok){ const e=new Error(d.error||"存檔失敗"); e.auth=!!d.auth; e.conflict=!!d.conflict; throw e; }
    afterSave(job,d); saveState="";
    setSync(`已存檔（${hhmm(Date.now())}）`);
  }catch(e){
    if(e.auth){ saving=false; localStorage.removeItem(LS_PASS); localStorage.removeItem(LS_CACHE); _closeDrawer(); view.innerHTML=""; setSync(""); showLogin(e.message+"（剛剛的修改沒有存到）"); return; }
    if(e.conflict){ saveState="conflict"; setSync(`沒有存到：${e.message}。點這裡重新讀取最新資料`,"bad"); toast("別的裝置剛改過，這次的修改沒有存。請重新讀取後再改一次"); }
    else { saveState="fail"; setSync(`存檔失敗（${e.message}），點這裡重試`,"bad"); }
  }finally{ saving=false; }
  if(saveState==="")(isDirty()?scheduleSave():afterIdle());
}
// 存完、沒有待存的修改了，才換上背景讀回來的新資料
function afterIdle(){ if(needRefresh&&!saving&&!isDirty()){ needRefresh=false; refresh(localStorage.getItem(LS_URL),localStorage.getItem(LS_PASS)||"",true); } }
let changes=0, tab="items", f={cat:"全部",sub:"全部",pub:"全部",q:""}, checked=new Set(), picking=false, ordView="shop", shopTop="", shopSub="", shopSeries="", shopSeriesOpen=false, shopQ="", assignMode=false, catEdit=false, catRename=null, catAdding=null, homeView="normal", picking2=false, sortMode=false, sortPick=null;

const $=s=>document.querySelector(s), view=$("#view");
const byNo=no=>ITEMS.find(i=>i.no===no), byCode=c=>ITEMS.find(i=>i.code===c);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const thumb=i=>i.photos?`<img class="thumb" src="${P(i.no,1)}" alt="" loading="lazy">`:`<div class="noimg">無照片</div>`;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600);}

// 新代號：5 個英數字，確認沒有跟現有的品項、分類、分組、頁面段落重複
const newCode=()=>{const used=new Set([...ITEMS.map(i=>i.code),...GROUPS.map(g=>g.id),...CATTREE.map(c=>c.id),...CATALOGUES.map(c=>c.id),...ABOUT.map(a=>a.id),...ENQ.items.map(e=>e.id)]);
  let c; do{c=Math.random().toString(36).slice(2,7);}while(c.length<5||used.has(c)); return c;};

// 缺漏檢查：只檢查公開的品項
function missing(i){
  if(!i.pub) return [];
  const m=[];
  if(!topOf(i)) m.push("缺官網分類");
  if(!i.out.zh) m.push("缺對外品名");
  if(!i.out.date) m.push("缺時代");
  if(!i.out.size) m.push("缺尺寸");
  if(!i.sel.length) m.push("沒勾照片");
  if(i.mainAuto) m.push("主圖未確認");
  if(!i.bg&&i.bgMark!=="主圖") m.push(i.bgq?(CUTMARKS[i.no]?"去背處理中・"+CUTMARKS[i.no].who:"等待去背"):i.bgMark==="失敗"?"去背失敗（列表用原圖）":"缺去背主圖");
  return m;
}

// 這件屬於哪個官網大分類（直接放在大分類，或放在它底下的子分類）
const topOf=i=>CATTREE.find(t=>!t.parent&&(t.members.includes(i.code)||CATTREE.some(k=>k.parent===t.id&&k.members.includes(i.code))));
// 依各大分類的「自動收哪些典藏大分類」重排成員（公開的品項）
function syncTops(){tops().forEach(t=>{t.members=ITEMS.filter(i=>i.pub&&i.code&&(t.src||[]).includes(i.cat)).map(i=>i.code);});}
function setPub(i,on){
  i.pub=on;
  if(on){ if(!i.code) i.code=newCode();
    // 還沒選照片的，先用典藏資料庫的封面（典藏排第一的照片）當主圖，並標「主圖未確認」提醒你看一眼（2026-11-19 Daniel）
    if(!i.sel.length&&coverId(i.no)){ i.sel=[coverId(i.no)]; i.mainAuto=true; }
    if(!ORDER.includes(i.code)) ORDER.unshift(i.code);   // 新公開的放最前面
    }
  else ORDER=ORDER.filter(c=>c!==i.code);
  syncTops();   // 大分類成員一律依典藏大分類重算
}

// ── 挑選藏品：照典藏資料庫的版面（照片卡片牆、分類件數、搜尋、挑選多選、最新的排前面）

  const inCat=i=>f.cat==="全部"||CATS[i.cat]===f.cat;
  const catCode=Object.keys(CATS).find(k=>CATS[k]===f.cat), subList=catCode?SUBCATS[catCode]:[];
  if(!subList.includes(f.sub)&&!(subList.length&&f.sub==="未分類"))f.sub="全部";
  const subsOf=i=>ITEM_SUBS[i.no]||[];
  const inSub=i=>f.sub==="全部"||(f.sub==="未分類"?!subsOf(i).length:subsOf(i).includes(f.sub));
  const list=ITEMS.filter(i=>inCat(i)&&inSub(i)&&(f.pub==="全部"||(f.pub==="已公開")===i.pub)
    &&(!f.q||(i.name+i.no+i.out.zh).includes(f.q))).sort((a,b)=>b.no.slice(3).localeCompare(a.no.slice(3)));
  const catChips=["全部","陶瓷","字畫","玉器","雜項"].map(v=>{const n=v==="全部"?ITEMS.length:ITEMS.filter(i=>CATS[i.cat]===v).length;
    return `<button class="chip" data-k="cat" data-v="${v}" aria-pressed="${f.cat===v}">${v}<span class="n">${n}</span></button>`}).join("");
  const inThisCat=ITEMS.filter(inCat);
  const subChips=subList.length?["全部",...subList,"未分類"].map(v=>{const n=v==="全部"?inThisCat.length:v==="未分類"?inThisCat.filter(i=>!subsOf(i).length).length:inThisCat.filter(i=>subsOf(i).includes(v)).length;
    return `<button class="chip" data-k="sub" data-v="${v}" aria-pressed="${f.sub===v}" style="font-size:12px">${v}<span class="n">${n}</span></button>`}).join(""):"";
  const pubChips=["全部","已公開","未公開"].map(v=>`<button class="chip" data-k="pub" data-v="${v}" aria-pressed="${f.pub===v}">${v}</button>`).join("");
  const pubN=ITEMS.filter(i=>i.pub).length, warnN=ITEMS.filter(i=>missing(i).length).length;
  view.innerHTML=`<p class="hint">這裡就是你的全部典藏，跟典藏資料庫同一份。點照片打開，在裡面切換「公開」就會上官網。已公開 ${pubN} 件${warnN?`，其中 ${warnN} 件資料還不完整`:""}。</p>
   <div class="ctlsent"></div><div class="ctlbox items-ctl">

   ${subChips?`<div class="filters" style="margin-top:-4px;padding-left:12px;border-left:2px solid var(--line)"><span class="hint" style="margin:0 4px 0 0">典藏細分類</span>${subChips}</div>`:""}
   <div class="toolbar"><input class="search" id="q" type="search" placeholder="搜尋品名、編號" value="${esc(f.q)}">
     ${pubChips}<span class="count">${list.length} 件</span>
     <button class="chip" id="pickBtn" aria-pressed="${picking}">☑ 挑選</button></div></div>
   <div class="grid">${list.map(i=>{const m=missing(i),pos=ORDER.indexOf(i.code);return `
     <button class="card2 ${checked.has(i.no)?"sel":""}" data-no="${i.no}" aria-label="${esc(i.out.zh||i.name)}">
       <div class="pic">${i.photos?`<img src="${P(i.no,1)}" alt="" loading="lazy">`:"無照片"}</div>
       ${i.pub?`<span class="badge pub">公開</span>`:""}
       ${picking?`<span class="tick">${checked.has(i.no)?"✓":""}</span>`:i.st?`<span class="badge2">${i.st}</span>`:""}
       <div class="meta"><span class="no">${i.no}</span>
         <span class="nm ${i.out.zh?"":"empty"}">${esc(i.out.zh||i.name)}</span>
         ${i.pub&&m.length?`<div class="flags">${m.map(x=>`<span class="flag">${x}</span>`).join("")}</div>`:""}
         ${(()=>{const ss=GROUPS.filter(g=>g.type==="系列"&&i.code&&g.members.includes(i.code));
           return ss.length?`<div class="stags">${ss.map(g=>`<span class="stag">${esc(g.zh)}</span>`).join("")}</div>`:"";})()}</div>
     </button>`}).join("")||`<p class="hint">沒有符合的品項</p>`}</div>
   <div class="batch ${picking?"on":""}"><span>已挑選 ${checked.size} 件</span><span class="spacer"></span>
     <button class="btn small" data-b="pub" ${checked.size?"":"disabled"}>設為公開</button><button class="btn small" data-b="unpub" ${checked.size?"":"disabled"}>設為不公開</button>
     <button class="btn small" data-b="SOLD" ${checked.size?"":"disabled"}>標 SOLD</button><button class="btn small" data-b="" ${checked.size?"":"disabled"}>標在庫</button>
     <button class="btn small" data-b="done">完成</button></div>`;
  view.querySelectorAll(".chip[data-k]").forEach(b=>b.onclick=()=>{f[b.dataset.k]=b.dataset.v;if(b.dataset.k==="cat")f.sub="全部";renderItems();});

// ── 官網陳列：預設照官網的樣子直接拖（電腦按住拖，手機長按再拖）；另有清單檢視（箭頭、移到最前）

function renderShop(){

      const v=[...VIS],i=v.indexOf(c),to=e.key==="ArrowLeft"||e.key==="ArrowUp"?i-1:e.key==="ArrowRight"||e.key==="ArrowDown"?i+1:-9;
      if(to<0||to>=v.length)return; e.preventDefault(); v.splice(i,1);v.splice(to,0,c);if(ser){ser.members=[...v,...ser.members.filter(x=>!v.includes(x))];}else ORDER=applyVisible(v);touch();renderShop();
      const n=view.querySelector(`.scard[data-c="${c}"]`); if(n)n.focus();};
    card.onpointerdown=e=>{
      if(e.button>0||e.target.closest(".rm")||assignMode)return;
      const sx=e.clientX, sy=e.clientY, touchLike=e.pointerType!=="mouse";
      let dragging=false, timer=null, lastX=sx, lastY=sy, raf=null;
      const blockScroll=ev=>{if(dragging)ev.preventDefault();};
      const begin=()=>{dragging=true; card.classList.add("lifting"); document.body.classList.add("dragging-row");
        if(navigator.vibrate)navigator.vibrate(15);
        const loop=()=>{const edge=90,v=lastY<edge?-(edge-lastY)/4:lastY>innerHeight-edge?(lastY-(innerHeight-edge))/4:0;
          if(v){scrollBy(0,v);place(lastX,lastY);} raf=requestAnimationFrame(loop);}; raf=requestAnimationFrame(loop);};
      const place=(x,y)=>{
        const others=[...grid.querySelectorAll(".scard")].filter(o=>o!==card);
        let target=null,before=true,best=1e9;
        others.forEach(o=>{const b=o.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,d=Math.hypot(x-cx,y-cy);
          if(d<best){best=d;target=o;before=(y<b.top)||(y<=b.bottom&&x<cx);}});
        if(target)before?grid.insertBefore(card,target):grid.insertBefore(card,target.nextSibling);
      };
      const onMove=ev=>{lastX=ev.clientX;lastY=ev.clientY;
        if(!dragging){const moved=Math.hypot(ev.clientX-sx,ev.clientY-sy);
          if(touchLike){ if(moved>16){clearTimeout(timer);end(false);} return; }   // 手機：長按前就移動＝在捲動（2026-11-19 放寬，手指微晃不取消）
          if(moved>5)begin(); else return;}
        place(ev.clientX,ev.clientY);};
      const end=(done=true)=>{clearTimeout(timer);cancelAnimationFrame(raf);
        removeEventListener("pointermove",onMove);removeEventListener("pointerup",onUp);removeEventListener("pointercancel",onUp);
        document.removeEventListener("touchmove",blockScroll);
        card.classList.remove("lifting");document.body.classList.remove("dragging-row");
        if(done&&dragging)commit(c);
        else if(done&&!dragging){sortMode?sortTap(c):openEditor(byCode(c));}};   // 輕點＝打開編輯面板（2026-11-19 Daniel）；排序模式裡＝選取／換位
      const onUp=()=>end(true);
      if(touchLike) timer=setTimeout(begin,350);
      addEventListener("pointermove",onMove);addEventListener("pointerup",onUp);addEventListener("pointercancel",onUp);
      document.addEventListener("touchmove",blockScroll,{passive:false});
    };
    card.oncontextmenu=e=>e.preventDefault();   // 手機長按不要跳出存圖選單
  });
}

    // 拖曳：用 pointer 事件，滑鼠和手指一樣；拖的時候直接在畫面上搬動這一列
    g.onpointerdown=e=>{
      if(e.button>0)return;

        const after=rows.find(x=>{const b=x.getBoundingClientRect();return y<b.top+b.height/2;});
        after?list.insertBefore(r,after):list.appendChild(r);
      };
      const autoScroll=()=>{const edge=80,v=lastY<edge?-(edge-lastY)/4:lastY>innerHeight-edge?(lastY-(innerHeight-edge))/4:0;
        if(v){scrollBy(0,v);reorderAt(lastY);} scrollTimer=requestAnimationFrame(autoScroll);};
      scrollTimer=requestAnimationFrame(autoScroll);
      // 監聽整個視窗，手指或滑鼠移出把手範圍也不會掉
      const onMove=ev=>{lastY=ev.clientY;reorderAt(ev.clientY);};
      const onUp=()=>{
        cancelAnimationFrame(scrollTimer);
        removeEventListener("pointermove",onMove); removeEventListener("pointerup",onUp); removeEventListener("pointercancel",onUp);
        r.classList.remove("lifting"); document.body.classList.remove("dragging-row");
        const next=[...list.querySelectorAll(".row")].map(x=>x.dataset.c);

      };
      addEventListener("pointermove",onMove); addEventListener("pointerup",onUp); addEventListener("pointercancel",onUp);
    };
  });
}

// ── 通用拖曳排序：有把手的清單（按住把手立刻拖），或卡片格子（電腦按住拖、手機長按）
function makeSortable(container,itemSel,opt,onCommit){
  const handle=opt.handle||null, grid=!!opt.grid;
  container.querySelectorAll(itemSel).forEach(el=>{
    const h=handle?el.querySelector(handle):el; if(!h)return;
    h.addEventListener("pointerdown",e=>{
      if(e.button>0)return;
      if(!handle&&!opt.self&&e.target.closest("button,input,textarea,select"))return;
      const touchLike=e.pointerType!=="mouse", immediate=!!handle, sx=e.clientX, sy=e.clientY;
      let dragging=false,timer=null,raf=null,lx=sx,ly=sy;
      if(handle)e.preventDefault();
      const block=ev=>{if(dragging)ev.preventDefault();};
      const place=(x,y)=>{const others=[...container.querySelectorAll(itemSel)].filter(o=>o!==el);if(!others.length)return;
        if(grid){let t=null,b=true,best=1e9;others.forEach(o=>{const r=o.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,d=Math.hypot(x-cx,y-cy);
            if(d<best){best=d;t=o;b=(y<r.top)||(y<=r.bottom&&x<cx);}});b?t.before(el):t.after(el);}
        else{const after=others.find(o=>{const r=o.getBoundingClientRect();return y<r.top+r.height/2;});after?after.before(el):others[others.length-1].after(el);}};
      const begin=()=>{dragging=true;el.classList.add("lifting");document.body.classList.add("dragging-row");if(navigator.vibrate)navigator.vibrate(12);
        const loop=()=>{const edge=90,v=ly<edge?-(edge-ly)/4:ly>innerHeight-edge?(ly-(innerHeight-edge))/4:0;if(v){scrollBy(0,v);place(lx,ly);}raf=requestAnimationFrame(loop);};raf=requestAnimationFrame(loop);};
      const move=ev=>{lx=ev.clientX;ly=ev.clientY;
        if(!dragging){const m=Math.hypot(lx-sx,ly-sy);if(touchLike&&!immediate){if(m>10)end(false);return;}if(m>5)begin();else return;}
        place(lx,ly);};
      const end=(ok=true)=>{clearTimeout(timer);cancelAnimationFrame(raf);
        removeEventListener("pointermove",move);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);document.removeEventListener("touchmove",block);
        el.classList.remove("lifting");document.body.classList.remove("dragging-row");
        if(ok&&dragging)onCommit([...container.querySelectorAll(itemSel)].map(x=>x.dataset.id));};
      const up=()=>end(true);
      if(touchLike&&!immediate)timer=setTimeout(begin,450);
      addEventListener("pointermove",move);addEventListener("pointerup",up);addEventListener("pointercancel",up);document.addEventListener("touchmove",block,{passive:false});
    });
  });
}

// ── 照片放大檢視（2026-11-24 Daniel）：ids＝這一輪可以左右切換的照片；pick＝選擇畫面時，下方可以直接勾選／取消
// 局部放大（2026-11-24 Daniel）：點一下放大 2.5 倍／再點還原；放大後拖曳移動；滾輪、兩指、− ＋ 縮放（最大 6 倍）。
// 放大時改讀高解析度版本（同一張、尺寸不變，只是更清楚）
const PV={ids:[],k:0,pick:null,back:null,s:1,tx:0,ty:0,hi:false};
const PV_MAX=6;
function openPv(ids,k,pick){PV.ids=ids;PV.k=k;PV.pick=pick||null;PV.back=document.activeElement;$("#pv").classList.add("on");showPv();$("#pvX").focus();}
// 照片在畫面上的大小固定下來（換高解析度版本時才不會跳動）
function pvFix(){const img=$("#pvImg");img.style.width=img.style.height="";img.style.transform="";
  const r=img.getBoundingClientRect(); if(r.width){img.style.width=r.width+"px";img.style.height=r.height+"px";}
  PV.s=1;PV.tx=PV.ty=0;pvApply();}
function pvApply(){const img=$("#pvImg"),pv=$("#pv");
  if(PV.s<=1.001){PV.s=1;PV.tx=PV.ty=0;}
  else{ // 放大後不讓照片被拖出畫面：比畫面小就置中，比畫面大就不讓邊緣離開畫面
    img.style.transform="";const b=img.getBoundingClientRect(),w=b.width*PV.s,h=b.height*PV.s,W=innerWidth,H=innerHeight;
    PV.tx=w<=W?W/2-b.left-w/2:Math.min(-b.left,Math.max(W-b.left-w,PV.tx));
    PV.ty=h<=H?H/2-b.top-h/2:Math.min(-b.top,Math.max(H-b.top-h,PV.ty));}
  img.style.transform=`translate(${PV.tx}px,${PV.ty}px) scale(${PV.s})`;
  pv.classList.toggle("zoomed",PV.s>1);$("#pvPct").textContent=Math.round(PV.s*100)+"%";
  $("#pvZo").disabled=PV.s<=1;$("#pvZi").disabled=PV.s>=PV_MAX;
  if(PV.s>1&&!PV.hi){PV.hi=true;const id=PV.ids[PV.k];const hi=new Image();hi.onload=()=>{if(PV.ids[PV.k]===id&&$("#pv").classList.contains("on"))img.src=hi.src;};hi.src=driveThumb(id,3200);}}
// 以畫面上的某一點為中心縮放
function pvZoomAt(ns,px,py){ns=Math.min(PV_MAX,Math.max(1,ns));const img=$("#pvImg");
  img.style.transform="";const b=img.getBoundingClientRect();
  const ux=(px-b.left-PV.tx)/PV.s, uy=(py-b.top-PV.ty)/PV.s;   // 那一點在照片上的位置（原尺寸）
  PV.tx=px-b.left-ux*ns; PV.ty=py-b.top-uy*ns; PV.s=ns; pvApply();}
const pvCenter=()=>[innerWidth/2,innerHeight/2];
function showPv(){const id=PV.ids[PV.k],img=$("#pvImg");
  PV.hi=false; img.style.width=img.style.height=""; PV.s=1;PV.tx=PV.ty=0; img.style.transform=""; $("#pv").classList.remove("zoomed"); $("#pvPct").textContent="100%";
  $("#pvLoad").hidden=false; img.style.visibility="hidden";
  img.onload=()=>{if(img.style.visibility==="hidden"){$("#pvLoad").hidden=true;img.style.visibility="";pvFix();}};
  img.onerror=()=>{$("#pvLoad").textContent="照片讀不到";};
  $("#pvLoad").textContent="載入中…"; img.src=driveThumb(id,1600);
  $("#pvCount").textContent=`${PV.k+1} / ${PV.ids.length}`;
  $("#pvP").hidden=$("#pvN").hidden=PV.ids.length<2;
  const t=$("#pvTick"); t.hidden=!PV.pick;
  if(PV.pick){const on=PV.pick.isOn(id);t.textContent=on?"✓ 已勾選（點一下取消）":"勾選這張";t.classList.toggle("on",on);}}
function closePv(){$("#pv").classList.remove("on");$("#pvImg").removeAttribute("src");if(PV.back&&PV.back.isConnected)PV.back.focus();}
const pvGo=d=>{if(PV.ids.length<2)return;PV.k=(PV.k+d+PV.ids.length)%PV.ids.length;showPv();};
$("#pvX").onclick=closePv; $("#pvP").onclick=()=>pvGo(-1); $("#pvN").onclick=()=>pvGo(1);
$("#pvTick").onclick=()=>{if(PV.pick){PV.pick.toggle(PV.ids[PV.k]);showPv();}};
$("#pv").onclick=e=>{if(e.target.id==="pv")closePv();};   // 點背景關掉
// Esc、左右鍵：放大畫面開著時先給它用，不要連編輯面板一起關掉
addEventListener("keydown",e=>{if(!$("#pv").classList.contains("on"))return;
  if(e.key==="Escape"){closePv();e.stopImmediatePropagation();}
  else if(e.key==="ArrowLeft")pvGo(-1); else if(e.key==="ArrowRight")pvGo(1);
  else if(e.key==="+"||e.key==="=")pvZoomAt(PV.s*1.5,...pvCenter()); else if(e.key==="-")pvZoomAt(PV.s/1.5,...pvCenter());},true);
$("#pvZi").onclick=()=>pvZoomAt(PV.s*1.5,...pvCenter());
$("#pvZo").onclick=()=>pvZoomAt(PV.s/1.5,...pvCenter());
$("#pv").addEventListener("wheel",e=>{e.preventDefault();pvZoomAt(PV.s*(e.deltaY<0?1.2:1/1.2),e.clientX,e.clientY);},{passive:false});
addEventListener("resize",()=>{if($("#pv").classList.contains("on")&&$("#pvImg").style.visibility!=="hidden")pvFix();});
// 照片上：點一下放大／還原（沒拖動才算點）、拖曳移動、兩指縮放
{const img=$("#pvImg"),pts=new Map();let moved=false,pinch=null;
  img.addEventListener("pointerdown",e=>{e.preventDefault();img.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:PV.s};}
    $("#pv").classList.add("panning");});
  img.addEventListener("pointermove",e=>{const p=pts.get(e.pointerId);if(!p)return;
    const dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;p.x=e.clientX;p.y=e.clientY;
    if(pts.size===2&&pinch){const [a,b]=[...pts.values()];pvZoomAt(pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);}
    else if(pts.size===1&&PV.s>1){PV.tx+=dx;PV.ty+=dy;pvApply();}});
  const up=e=>{const had=pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)$("#pv").classList.remove("panning");
    if(had&&!moved&&e.type==="pointerup")pvZoomAt(PV.s>1?1:2.5,e.clientX,e.clientY);};
  img.addEventListener("pointerup",up);img.addEventListener("pointercancel",up);
  img.addEventListener("click",e=>e.stopPropagation());}

  let phDragged=false;

// Claude 用 Gemini 描好輪廓後，在這個（已登入的）分頁呼叫 window.cutoutReceive(編號, 輪廓字串, 雜湊)。
// 這裡自己讀原圖、合成、把成品 PNG 解碼回來逐點驗證，結果放進總表；Daniel 按「全部寫入」才存進 Drive、填 AG，
// 存完自動更新預覽（正式發布 Daniel 自己按）。通行碼和上傳都在這頁完成，不經過 Claude。
// 紅線：離邊緣 ≥3 像素的器物區＝原圖像素、0 差異；最外 2 像素漸層（1/3、2/3）；其餘填底色 #F2F0EC。
// 合成公式跟去背技能 guanwang-quba 的 C3 程式相同（Chebyshev 距離、floor(原圖×t＋底色×(1−t)＋0.5)）。
// 輪廓字串：逐列，器物段寫「起點36進位-長度36進位」，同列多段用「.」，列與列用「|」，跟上一列相同的 n 列寫「*n」（十進位）。
// 雜湊：對每個像素的 0/1 依序 h=(h*31+v)>>>0。
const CUT_BG=[242,240,236];
let CUTMARKS={};            // 處理中標記 {編號:{who,at}}（後端指令碼屬性，2 小時失效）
const CUTQ=new Map();       // 收到的件：編號 → {no,name,src,ok,err,st,origUrl,outUrl,outBlob,maskBlob,take}
let cutting=false;

// 原圖用 =d（原檔 bytes）。=s0 有時會被 Google 改寫檔頭（2026-11-26 ZH-1151031-012 少 26 bytes），PNG 甚至整個重新壓縮
const lh3=id=>`https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}=d`;
const cutTodo=()=>ITEMS.filter(i=>i.bgq);
function cutDecode(rle,W,H){
  const rows=[];
  for(const t of String(rle).trim().split("|")){
    if(t[0]==="*"){const n=parseInt(t.slice(1),10); if(!(n>0)||!rows.length)throw new Error("輪廓字串格式不對（*n）"); for(let k=0;k<n;k++)rows.push(rows[rows.length-1]);}
    else rows.push(t);
  }
  if(rows.length!==H)throw new Error(`輪廓有 ${rows.length} 列，原圖高 ${H}，對不上`);
  const m=new Uint8Array(W*H);
  rows.forEach((r,y)=>{ if(!r)return; r.split(".").forEach(s=>{const p=s.split("-"), x0=parseInt(p[0],36), len=parseInt(p[1],36);
    if(p.length!==2||!(x0>=0)||!(len>0)||x0+len>W)throw new Error(`輪廓第 ${y+1} 列超出原圖寬度 ${W}`); m.fill(1,y*W+x0,y*W+x0+len);});});
  return m;
}
function cutHash(m){ let h=0; for(let k=0;k<m.length;k++)h=(h*31+m[k])>>>0; return h; }
// 器物連通區塊（8 方向相連）：回傳每塊的像素數
function cutParts(m,W,H){
  const seen=new Uint8Array(W*H), stack=new Int32Array(W*H), sizes=[];
  for(let s=0;s<m.length;s++){ if(!m[s]||seen[s])continue;
    let top=0,n=0; stack[top++]=s; seen[s]=1;
    while(top){ const p=stack[--top]; n++; const x=p%W, y=(p-x)/W;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ const xx=x+dx, yy=y+dy;
        if(xx<0||yy<0||xx>=W||yy>=H)continue; const q=yy*W+xx; if(m[q]&&!seen[q]){seen[q]=1;stack[top++]=q;} } }
    sizes.push(n); }
  return sizes.sort((a,b)=>b-a);
}
// Chebyshev 距離（上限 3），跟技能的 numpy 寫法一樣：圖邊不算背景
function cutDist(m,W,H){
  let d=new Uint8Array(W*H); for(let k=0;k<d.length;k++)d[k]=m[k]?3:0;
  for(const k of [1,2]){ const nd=d.slice();
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const p=y*W+x; if(d[p]<=k)continue;
      let near=false;
      for(let dy=-1;dy<=1&&!near;dy++)for(let dx=-1;dx<=1;dx++){ const xx=x+dx, yy=y+dy;
        if(xx>=0&&yy>=0&&xx<W&&yy<H&&d[yy*W+xx]===k-1){near=true;break;} }
      if(near)nd[p]=k; }
    d=nd; }
  return d;
}
const loadImg=url=>new Promise((res,rej)=>{const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("圖片解不開")); im.src=url;});
function pixels(im,W,H){ const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const cx=cv.getContext("2d",{willReadFrequently:true}); cx.drawImage(im,0,0); return cx.getImageData(0,0,W,H); }
const toPng=(data,W,H)=>{ const cv=document.createElement("canvas"); cv.width=W; cv.height=H; cv.getContext("2d").putImageData(data,0,0);
  return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("做不出 PNG")),"image/png")); };

  const x={no,name:i.out.zh||i.name,src,ok:false,err:"",st:{},take:true};
  try{
    // 讀原圖：Google 偶爾回 429（請求太多）或 5xx，等一下再試，最多 3 次
    let r;
    for(const wait of [0,2000,5000]){ if(wait)await sleep(wait);
      try{ r=await fetch(lh3(src),{cache:"no-store"}); }catch(e){ r=null; continue; }
      if(r.ok||(r.status!==429&&r.status<500))break; }
    if(!r)throw new Error("讀不到原圖（網路或權限）");
    if(!r.ok)throw new Error("讀不到原圖（HTTP "+r.status+"）");
    const ob=await r.blob(); x.origUrl=URL.createObjectURL(ob);
    const im=await loadImg(x.origUrl), W=im.naturalWidth, H=im.naturalHeight;
    const O=pixels(im,W,H).data;
    const m=cutDecode(rle,W,H), h=cutHash(m);
    if(hash!==undefined&&hash!==null&&String(hash)!==String(h))throw new Error(`輪廓雜湊對不上（收到 ${hash}，算出 ${h}），資料可能傳漏了`);
    const total=W*H, fg=m.reduce((a,v)=>a+v,0), bgRatio=1-fg/total;
    const parts=cutParts(m,W,H), maxParts=opts.parts||(/一對|對聯|聯/.test(x.name)?2:1);
    Object.assign(x.st,{W,H,hash:h,bytesIn:ob.size,bgRatio:Math.round(bgRatio*1000)/10,parts:parts.length});
    if(bgRatio<0.1||bgRatio>0.9)throw new Error(`背景比例 ${x.st.bgRatio}% 不合理（要在 10%～90%）`);
    if(parts.length>maxParts)throw new Error(`器物分成 ${parts.length} 塊（預期最多 ${maxParts} 塊）`);
    if(parts.some(n=>n<total*0.002))throw new Error("有太小的器物碎塊（小於畫面 0.2%）");
    const d=cutDist(m,W,H), out=new ImageData(W,H), P=out.data;
    let core=0;
    for(let p=0,q=0;p<total;p++,q+=4){ const k=d[p];
      if(k>=3){P[q]=O[q];P[q+1]=O[q+1];P[q+2]=O[q+2];core++;}
      else{ const t=k/3; for(let c=0;c<3;c++)P[q+c]=Math.floor(O[q+c]*t+CUT_BG[c]*(1-t)+0.5); }
      P[q+3]=255; }
    x.outBlob=await toPng(out,W,H);
    const mk=new ImageData(W,H); for(let p=0,q=0;p<total;p++,q+=4){const v=m[p]?255:0;mk.data[q]=mk.data[q+1]=mk.data[q+2]=v;mk.data[q+3]=255;}
    x.maskBlob=await toPng(mk,W,H);
    // 驗證：把成品 PNG 解碼回來，核心像素逐點比原圖；整張也要跟合成結果一模一樣
    x.outUrl=URL.createObjectURL(x.outBlob);
    const R=pixels(await loadImg(x.outUrl),W,H).data;
    let diff=0, all=0;
    for(let p=0,q=0;p<total;p++,q+=4){
      const same=R[q]===P[q]&&R[q+1]===P[q+1]&&R[q+2]===P[q+2]&&R[q+3]===255;
      if(!same)all++;
      if(d[p]>=3&&(R[q]!==O[q]||R[q+1]!==O[q+1]||R[q+2]!==O[q+2]))diff++; }
    Object.assign(x.st,{core,diff,allDiff:all,bytes:x.outBlob.size});
    if(diff||all)throw new Error(`驗證沒過：核心像素差異 ${diff}、整張差異 ${all}（不放寬，這件標失敗）`);
    x.ok=true;
  }catch(e){ x.err=e.message||String(e); }
  return x;
}

function cutPaint(){
  const b=$("#cutBtn"); if(!b)return;
  const n=SNAP?cutTodo().length:0, got=[...CUTQ.values()].filter(x=>x.ok).length;
  b.hidden=!(n||CUTQ.size);
  b.textContent=got?`去背總表 ${got}`:`去背待辦 ${n}`;
  b.className="btn small"+(got?" primary":"");
}
function cutReviewHtml(){
  const xs=[...CUTQ.values()], ok=xs.filter(x=>x.ok), take=ok.filter(x=>x.take);
  const waiting=cutTodo().filter(i=>!CUTQ.has(i.no));
  const st=x=>x.st.core!==undefined?`${x.st.W}×${x.st.H}・核心像素 ${x.st.core.toLocaleString()}・差異 ${x.st.diff}・器物 ${x.st.parts} 塊・背景 ${x.st.bgRatio}%`:(x.st.W?`${x.st.W}×${x.st.H}`:"");
  return (xs.length?`<p>收到 ${xs.length} 件：可以寫入 <b>${ok.length}</b> 件${xs.length>ok.length?`、失敗 <b>${xs.length-ok.length}</b> 件`:""}。`+
      `對照原圖｜成品，不要的取消勾選，按「全部寫入」才會存進 Drive、填去背主圖，存完自動更新預覽。</p>`:`<p>還沒收到任何去背成品。</p>`)+
    xs.map(x=>`<div class="cutrow ${x.ok?"":"bad"}"><div class="cuthd">${x.ok?`<label><input type="checkbox" data-cut="${esc(x.no)}" ${x.take?"checked":""}>${esc(x.name)}</label>`:`<b>${esc(x.name)}</b>`}
        <span class="cutst">${esc(x.no)}${st(x)?"・"+st(x):""}</span></div>
      ${x.ok?"":`<p class="alarm" style="margin:6px 0 0">去背失敗：${esc(x.err)}。這件維持「等待去背」。${byNo(x.no)&&byNo(x.no).bgq?` <button type="button" class="btn small" data-cutfail="${esc(x.no)}">標為去背失敗（列表用原圖）</button>`:""}</p>`}
      ${x.origUrl||x.outUrl?`<div class="cutpair">${x.origUrl?`<figure><a href="${x.origUrl}" target="_blank" rel="noopener"><img src="${x.origUrl}" alt="原圖"></a><figcaption>原圖</figcaption></figure>`:""}${x.outUrl?`<figure><a href="${x.outUrl}" target="_blank" rel="noopener"><img src="${x.outUrl}" alt="成品"></a><figcaption>成品（點圖看原尺寸）</figcaption></figure>`:""}</div>`:""}</div>`).join("")+
    (waiting.length?`<p class="hint">還在等的 ${waiting.length} 件：${waiting.map(i=>esc(i.out.zh||i.name)+(CUTMARKS[i.no]?`（處理中・${esc(CUTMARKS[i.no].who)}）`:"")).join("、")}</p>`:"")+
    `<details class="cutpaste"><summary>貼上輪廓資料（給 Claude 備用）</summary><textarea id="cutIn" placeholder='{"no":"ZH-…","rle":"…","hash":123}' spellcheck="false"></textarea>
      <button type="button" class="btn small" id="cutInGo">收件</button></details>`;
}
let cutOpen=false;
function cutoutReview(){
  if(publishing||cutting)return false;
  const ok=[...CUTQ.values()].filter(x=>x.ok), take=ok.filter(x=>x.take).length;
  const close=()=>{cutOpen=false;pubClose();};
  pubShow("去背總表",cutReviewHtml(),[
    ...(CUTQ.size?[{label:"全部放掉",left:true,fn:()=>{CUTQ.forEach(cutFree);CUTQ.clear();cutPaint();cutoutReview();}}]:[]),
    {label:"稍後再說",fn:close},
    ...(ok.length?[{label:`全部寫入（${take} 件）`,primary:true,fn:()=>cutoutCommit()}]:[])]);
  $(".pubbox").classList.add("wide"); cutOpen=true;
  // 游標停在「稍後再說」，不要停在「全部寫入」：免得不小心按到 Enter／空白鍵就寫入（2026-11-25 測試時發生過）
  [...$("#pubFoot").children].find(b=>b.textContent==="稍後再說").focus();
  $("#pubBody").querySelectorAll("[data-cut]").forEach(c=>c.onchange=()=>{const x=CUTQ.get(c.dataset.cut); if(x)x.take=c.checked;
    const b=$("#pubFoot .primary"); if(b)b.textContent=`全部寫入（${[...CUTQ.values()].filter(y=>y.ok&&y.take).length} 件）`;});
  $("#pubBody").querySelectorAll("[data-cutfail]").forEach(b=>b.onclick=()=>{const i=byNo(b.dataset.cutfail),x=CUTQ.get(b.dataset.cutfail);
    if(i){setBg(i,"失敗");touch();} cutFree(x);CUTQ.delete(b.dataset.cutfail);cutPaint();render();toast("已標為去背失敗");cutoutReview();});
  $("#cutInGo").onclick=async()=>{ let list;
    try{ list=JSON.parse($("#cutIn").value); }catch(e){ toast("看不懂貼上的資料（要是 JSON）"); return; }
    for(const o of [].concat(list)) await cutoutReceive(o.no,o.rle,o.hash,o);
    cutoutReview(); };
  return true;
}
$("#pubDlg").addEventListener("click",e=>{ if(e.target.id==="pubDlg")cutOpen=false; });
async function cutoutReceive(no,rle,hash,opts){
  if(!SNAP)throw new Error("控制台資料還沒讀好");
  const x=await cutBuild(String(no||""),rle,hash,opts||{});
  cutPut(x);
  if(!publishing&&!cutting&&(cutOpen||$("#pubDlg").hidden))cutoutReview();
  return {no:x.no,ok:x.ok,error:x.err||undefined,...x.st};
}
function cutoutFail(no,reason){
  const i=byNo(no); if(!i)throw new Error("找不到品項 "+no);
  cutPut({no,name:i.out.zh||i.name,src:cutSrc(i),ok:false,err:String(reason||"Gemini 描不出輪廓"),st:{},take:false});
  if(!publishing&&!cutting&&(cutOpen||$("#pubDlg").hidden))cutoutReview();
  return {no,ok:false};
}
// 寫入後把控制台手上的資料也換成新的檔案 ID，免得自動存檔把「待辦」寫回去
function cutApply(i,id){
  setBg(i,id); i.raw.bg=id;
  if(SNAP&&SNAP.items[i.no])SNAP.items[i.no].bg=id;
  const r=DATA.items.find(x=>x.id===i.no); if(r)r.web={...(r.web||{}),bg:id};
  delete CUTMARKS[i.no]; DATA.cutoutMarks={...CUTMARKS}; saveCache(DATA);
}
async function cutoutCommit(){
  if(cutting||publishing)return {ok:false,error:"正在處理別的事，請稍後"};
  const list=[...CUTQ.values()].filter(x=>x.ok&&x.take);
  if(!list.length){ toast("沒有勾選要寫入的"); return {ok:false,error:"沒有勾選要寫入的"}; }
  cutting=true; cutOpen=false;
  const done=[], fail=[], title="寫入去背圖";
  try{
    pubShow(title,busyHtml("先把剛剛的修改存好…"),[],true);
    await flushSave();
    for(const [k,x] of list.entries()){
      pubShow(title,busyHtml(`寫入第 ${k+1}／${list.length} 件：${x.name}…`),[],true);
      try{
        const i=byNo(x.no);
        if(!i||!i.bgq)throw new Error("已經不在去背待辦");
        if(cutSrc(i)!==x.src)throw new Error("主圖換過了，輪廓對不上");
        const d=await postApi({action:"webSaveCutout",id:x.no,src:x.src,png:await toB64(x.outBlob),mask:await toB64(x.maskBlob)});
        cutApply(i,d.bg); CUTQ.delete(x.no); cutFree(x); done.push({no:x.no,name:x.name,bg:d.bg,replaced:d.replaced});
      }catch(e){ if(e.auth)throw e; x.ok=false; x.err="寫入失敗："+e.message; fail.push({no:x.no,name:x.name,error:e.message}); }
    }
  }catch(e){
    cutting=false; pubBusy=false;
    if(e.auth){ $("#pubDlg").hidden=true; localStorage.removeItem(LS_PASS); localStorage.removeItem(LS_CACHE); _closeDrawer(); view.innerHTML=""; setSync(""); SNAP=null; showLogin(e.message); return {ok:false,error:e.message}; }
    pubShow(title,`<p class="alarm">沒有寫入：${esc(e.message)}</p>`,[{label:"關閉",fn:pubClose}]);
    return {ok:false,error:e.message,written:done};
  }finally{ cutting=false; pubBusy=false; }
  cutPaint(); render();
  const failHtml=fail.length?`<p class="alarm">有 ${fail.length} 件沒寫入：${fail.map(f=>esc(f.name)+"（"+esc(f.error)+"）").join("、")}</p>`:"";
  if(done.length) await runPublish("preview",{auto:true,note:`已寫入 ${done.length} 件去背圖：${done.map(x=>esc(x.name)).join("、")}`+failHtml});
  else pubShow(title,failHtml,[{label:"關閉",fn:pubClose}]);
  return {ok:!fail.length,written:done,failed:fail};
}
// 給 Claude 用的（在已登入的控制台分頁呼叫）
window.cutoutTodo=()=>{ if(!SNAP)throw new Error("控制台資料還沒讀好");
  return cutTodo().map(i=>{const s=cutSrc(i);return {no:i.no,name:i.out.zh||i.name,cat:CATS[i.cat],src:s,url:s?lh3(s):"",mark:CUTMARKS[i.no]||null,received:CUTQ.has(i.no)};}); };
window.cutoutMark=async(nos,who,on=true)=>{ const d=await postApi({action:"webCutoutMark",ids:[].concat(nos),who,on});
  CUTMARKS={...(d.marks||{})}; if(DATA){DATA.cutoutMarks={...CUTMARKS};saveCache(DATA);} cutPaint(); if($("#pubDlg").hidden)render(); return CUTMARKS; };
window.cutoutReceive=cutoutReceive;
window.cutoutFail=cutoutFail;
window.cutoutReview=cutoutReview;
window.cutoutCommit=cutoutCommit;
window.cutoutStatus=()=>[...CUTQ.values()].map(x=>({no:x.no,name:x.name,ok:x.ok,take:x.take,error:x.err||undefined,...x.st}));
$("#cutBtn").onclick=()=>cutoutReview();

$("#previewBtn").onclick=()=>runPublish("preview");
$("#publishBtn").onclick=()=>runPublish("site");

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.t===tab)));
  ({items:renderItems,order:renderOrder,home:renderHome,groups:renderEx,cata:renderCata,about:renderAbout,enq:renderEnq})[tab]();
  cutPaint();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{tab=t.dataset.t;render();});

// ── 登入、讀取資料（2026-11-24 第 4 步之①）
// 後端網址和通行碼記在這台裝置的瀏覽器裡（跟典藏資料庫一樣），不寫進程式碼
const LS_URL="webCtlUrl", LS_PASS="webCtlPass";
const URL_OK=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
async function fetchData(url,pass){
  let r;
  try{ r=await fetch(`${url}?action=webData&k=${encodeURIComponent(pass)}`,{cache:"no-store"}); }
  catch(e){ throw new Error("連不上後端，請確認網路和網址"); }
  let d;
  try{ d=await r.json(); }catch(e){ throw new Error("後端的回應看不懂，網址可能不對"); }
  if(!d.ok){ const e=new Error(d.error||"讀取失敗"); e.auth=!!d.auth; throw e; }
  return d;
}
function showLogin(msg){
  $("#login").hidden=false;
  $("#lgUrl").value=localStorage.getItem(LS_URL)||"";
  $("#lgErr").textContent=msg||"";
  ($("#lgUrl").value?$("#lgPass"):$("#lgUrl")).focus();
}
function start(d){ $("#login").hidden=true; $("#lgErr").textContent=""; loadData(d); paintPending(); render(); }

// 記住上次讀到的資料（2026-11-24 Daniel：登入太久）：下次打開先顯示這份，後端在背景更新，好了再換上
// 裡面有內部資料（簡述等），所以登出時一併清掉
const LS_CACHE="webCtlCache";
const hhmm=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;};
function setSync(text,cls){ const s=$("#sync"); s.textContent=text; s.className="sync"+(cls?" "+cls:""); }
function saveCache(d){ try{ localStorage.setItem(LS_CACHE,JSON.stringify({t:Date.now(),d})); }catch(e){ localStorage.removeItem(LS_CACHE); } }
function readCache(){ try{ return JSON.parse(localStorage.getItem(LS_CACHE)||"null"); }catch(e){ return null; } }
// 背景更新回來時，如果你正在編輯某一件，先不換，等關掉編輯面板再換
let fresh=null;
const _closeDrawer=()=>{ fresh=null; closeDrawer(); };   // 關掉面板但不換資料（登出、登入失效時用）
function applyFresh(d){
  if($("#drawer").classList.contains("on")){ fresh=d; return; }
  // 還有修改在存、或還沒存：先存完，存完再重新讀一次（不然會用舊資料蓋掉剛改的）
  if(saving||isDirty()){ needRefresh=true; return; }
  start(d);
}
async function refresh(url,pass,hadCache){
  setSync("更新中…","busy");
  try{
    const d=await fetchData(url,pass); saveCache(d);
    if(hadCache)applyFresh(d); else start(d);
    setSync(`已是最新（${hhmm(Date.now())}）`);
  }catch(e){
    if(e.auth){ localStorage.removeItem(LS_PASS); localStorage.removeItem(LS_CACHE); _closeDrawer(); view.innerHTML=""; setSync(""); showLogin(e.message); return; }
    if(hadCache)setSync("更新失敗，畫面是上次的資料","bad");
    else { view.innerHTML=""; setSync(""); showLogin(e.message); }
  }
}
async function boot(){
  const url=localStorage.getItem(LS_URL);
  if(!url){ showLogin(); return; }
  const c=readCache();
  // 之①留下的舊資料沒有版本指紋，不能拿來存檔，直接重讀
  if(c&&c.d&&c.d.vers){ start(c.d); }
  else view.innerHTML=`<p class="hint">正在讀取典藏資料…（約需幾秒）</p>`;
  refresh(url,localStorage.getItem(LS_PASS)||"",!!(c&&c.d&&c.d.vers));
}
$("#loginForm").onsubmit=async ev=>{
  ev.preventDefault();
  const url=$("#lgUrl").value.trim(), pass=$("#lgPass").value;
  if(!URL_OK.test(url)){ $("#lgErr").textContent="網址格式不對，應該是 https://script.google.com/macros/s/…/exec"; return; }
  $("#lgBtn").disabled=true; $("#lgErr").textContent="登入中…";
  try{
    const d=await fetchData(url,pass);
    localStorage.setItem(LS_URL,url);
    if(pass)localStorage.setItem(LS_PASS,pass); else localStorage.removeItem(LS_PASS);
    $("#lgPass").value=""; saveCache(d); start(d); setSync(`已是最新（${hhmm(Date.now())}）`);
  }catch(e){ $("#lgErr").textContent=e.message; }
  finally{ $("#lgBtn").disabled=false; }
};
$("#logoutBtn").onclick=()=>{
  if((saving||isDirty())&&!confirm("還有修改沒存好，登出會丟掉這些修改。確定要登出？"))return;
  clearTimeout(saveTimer); saveState=""; SNAP=null; needRefresh=false;
  localStorage.removeItem(LS_PASS); localStorage.removeItem(LS_CACHE); fresh=null; _closeDrawer(); view.innerHTML=""; setSync(""); showLogin("已登出，這台裝置不再記住通行碼和資料。"); };
// 存檔狀態那行字：失敗時點了重試；被別的裝置改過時點了重新讀取（這台沒存到的修改會放掉）
$("#sync").onclick=()=>{
  if(saveState==="fail"){ saveState=""; saveNow(); }
  else if(saveState==="conflict"){ saveState=""; SNAP=null; clearTimeout(saveTimer); refresh(localStorage.getItem(LS_URL),localStorage.getItem(LS_PASS)||"",true); }
};
// ── 捲動時的頂部（2026-11-24 Daniel：照典藏資料庫瀏覽頁）：往下滑收起頂部和分類／搜尋列，往上撥超過 HB_UP 像素就滑出；
//    分類／搜尋列還沒滑過時跟著頁面捲（看 .ctlsent 這個記號的位置），滑過後才跟著頂部收放。正在打字搜尋時不收。
//    右下「↑」：捲超過 300 像素出現，點了回頂部。
const HB={hid:false,up:0,lastY:scrollY,tick:false}, HB_UP=10;
function hbUpdate(){
  const top=$(".top"), y=scrollY, dy=y-HB.lastY; HB.lastY=y;
  const hH=top.offsetHeight, box=view.querySelector(".ctlbox"), sent=view.querySelector(".ctlsent");
  const typing=top.contains(document.activeElement)||!!(box&&box.contains(document.activeElement));
  if(y<=hH){HB.hid=false;HB.up=0;}
  else if(dy>0){HB.up=0;if(!typing)HB.hid=true;}
  else if(dy<0){HB.up-=dy;if(HB.up>=HB_UP)HB.hid=false;}
  top.classList.toggle("hid",HB.hid);
  let stack=HB.hid?0:hH;
  if(box){const stuck=!!sent&&sent.getBoundingClientRect().top<hH+1;
    box.classList.toggle("stuck",stuck&&!HB.hid); box.classList.toggle("hid",stuck&&HB.hid);
    if(stuck&&!HB.hid)stack+=box.offsetHeight;}
  document.body.style.setProperty("--hdrH",hH+"px");
  document.body.style.setProperty("--stack",stack+"px");
  $("#toTop").classList.toggle("show",y>300);
  document.body.classList.toggle("has-batch",!!view.querySelector(".batch.on"));
}
addEventListener("scroll",()=>{if(HB.tick)return;HB.tick=true;requestAnimationFrame(()=>{HB.tick=false;hbUpdate();});},{passive:true});
addEventListener("resize",()=>requestAnimationFrame(hbUpdate));
// 分頁重畫（換分類、打字搜尋等）後，把目前的收放狀態套回新的分類列
// （在畫面更新前就套上，不然收起的分類列會先閃一下）
new MutationObserver(()=>hbUpdate()).observe(view,{childList:true});
$("#toTop").onclick=()=>{scrollTo({top:0,behavior:"smooth"});};

// 還有修改沒存好就關頁面，瀏覽器會先問
addEventListener("beforeunload",e=>{ if(saving||publishing||isDirty()){ e.preventDefault(); e.returnValue=""; } });
boot();
</script>
