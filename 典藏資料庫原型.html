<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典藏資料庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#1a1612;--ink2:#3d3530;--ink3:#7a6e68;--paper:#f5f0e8;--paper2:#ede7d9;--paper3:#e0d8c8;--accent:#8b4513;--accent2:#c47d3e;--jade:#3d7a5e;--border:rgba(26,22,18,0.14);--r:4px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-size:13px;font-family:'Noto Sans TC',sans-serif;max-width:680px;margin:0 auto;}
#app{min-height:100vh;}
.header{background:var(--ink);padding:14px 20px 0;display:flex;align-items:flex-end;}
.htitle{font-family:'Noto Serif TC',serif;font-weight:300;font-size:15px;color:var(--paper2);letter-spacing:4px;padding-bottom:14px;margin-right:auto;}
.hright{display:flex;align-items:flex-end;gap:0;}
.tabs{display:flex;}
.tab{padding:8px 18px;font-size:12px;letter-spacing:2px;cursor:pointer;color:rgba(245,240,232,0.4);border-bottom:2px solid transparent;transition:all .2s;}
.tab.on{color:var(--paper);border-bottom-color:var(--accent2);}
.hsetup{padding:8px 14px;font-size:11px;letter-spacing:1px;cursor:pointer;color:rgba(245,240,232,0.3);border-bottom:2px solid transparent;transition:color .2s;}
.hsetup:hover{color:rgba(245,240,232,0.6);}

/* CATEGORY BAR */
.catbar{display:flex;gap:6px;padding:10px 16px;background:var(--paper2);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.catbar::-webkit-scrollbar{display:none;}
.catf{flex-shrink:0;padding:5px 12px;font-size:11px;letter-spacing:1.5px;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:var(--paper);color:var(--ink2);transition:all .15s;font-family:'Noto Sans TC',sans-serif;}
.catf:hover{border-color:var(--accent2);color:var(--accent);}
.catf.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}

/* TOOLBAR */
.toolbar{padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;}
.search-wrap{flex:1;position:relative;}
.search-wrap input{width:100%;padding:7px 12px 7px 30px;border:1px solid var(--border);border-radius:20px;background:var(--paper2);font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--ink);outline:none;transition:border-color .15s;}
.search-wrap input:focus{border-color:var(--accent2);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:13px;pointer-events:none;}
.count{font-size:12px;color:var(--ink3);white-space:nowrap;}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;padding:14px 16px;}
.empty{text-align:center;padding:60px 20px;color:var(--ink3);}
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .2s;position:relative;}
.card:hover{border-color:var(--accent2);transform:translateY(-2px);box-shadow:0 4px 14px rgba(26,22,18,0.12);}
.card:active{transform:translateY(0);}
.card-img{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;position:relative;}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.card-body{padding:8px 10px;border-top:1px solid var(--border);}
.card-id{font-size:9px;color:var(--ink3);letter-spacing:1px;margin-bottom:2px;}
.card-name{font-family:'Noto Serif TC',serif;font-size:13px;color:var(--ink);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{font-size:11px;color:var(--ink3);display:flex;justify-content:space-between;align-items:center;}
.sdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;vertical-align:middle;}
.new-badge{position:absolute;top:6px;right:6px;background:var(--jade);color:#fff;font-size:9px;letter-spacing:1px;padding:2px 6px;border-radius:10px;}
@keyframes cardFlash{0%{box-shadow:0 0 0 0 rgba(61,122,94,0.6)}50%{box-shadow:0 0 0 6px rgba(61,122,94,0.15)}100%{box-shadow:0 0 0 0 rgba(61,122,94,0)}}
.card-saved{animation:cardFlash .8s ease-out;border-color:var(--jade)!important;}
mark{background:rgba(196,125,62,0.28);color:var(--ink);border-radius:2px;padding:0 1px;font-style:normal;}

/* BATCH MODE */
.batch-bar{display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--ink);color:var(--paper);position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(245,240,232,0.1);}
.batch-info{flex:1;font-size:12px;color:rgba(245,240,232,0.7);letter-spacing:.5px;}
.batch-info b{color:var(--paper);}
.bbtn{padding:6px 14px;font-size:11px;letter-spacing:1px;border:1px solid rgba(245,240,232,0.28);border-radius:20px;background:transparent;color:var(--paper);cursor:pointer;white-space:nowrap;transition:all .15s;}
.bbtn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:500;}
.bbtn:disabled{opacity:0.35;cursor:default;}
.tbatch{padding:5px 11px;font-size:11px;letter-spacing:1px;border:1px solid var(--border);border-radius:20px;background:var(--paper);color:var(--ink2);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;}
.tbatch.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.batch-chk{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;z-index:3;transition:all .15s;pointer-events:none;}
.card.b-sel{outline:2px solid var(--accent2);outline-offset:-2px;}
.card.b-sel .batch-chk{background:var(--accent2);border-color:var(--accent2);color:#fff;}

/* LOADING */
.loading-screen{text-align:center;padding:60px 20px;}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--jade);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.error-bar{background:rgba(163,45,45,0.08);border:1px solid rgba(163,45,45,0.25);border-radius:var(--r);padding:10px 16px;margin:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.error-msg{font-size:12px;color:#a32d2d;}
.error-retry{font-size:11px;color:#a32d2d;cursor:pointer;text-decoration:underline;white-space:nowrap;}
.api-saving{position:fixed;bottom:16px;right:16px;background:var(--ink);color:var(--paper2);font-size:11px;letter-spacing:1px;padding:7px 14px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:300;}
.api-saving.show{opacity:1;}

/* DETAIL PANEL */
.overlay{display:none;position:fixed;inset:0;background:rgba(26,22,18,0.5);z-index:100;justify-content:flex-end;}
.overlay.open{display:flex;}
.panel{width:min(460px,100%);height:100%;background:var(--paper);overflow-y:auto;display:flex;flex-direction:column;animation:slideIn .25s ease;}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.panel-header{background:var(--ink);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.panel-id{font-size:11px;letter-spacing:2px;color:rgba(245,240,232,0.6);}
.pbtn-close{background:none;border:none;color:rgba(245,240,232,0.6);font-size:18px;cursor:pointer;padding:4px 8px;line-height:1;transition:color .15s;}
.pbtn-close:hover{color:var(--paper);}
/* 圖片區：大圖 + 縮圖列 */
.panel-img-section{background:var(--paper2);border-bottom:1px solid var(--border);}
.panel-img-main{position:relative;width:100%;height:260px;display:flex;align-items:center;justify-content:center;background:var(--ink);overflow:hidden;cursor:pointer;}
.panel-img-main img{width:100%;height:100%;object-fit:contain;display:block;}
.panel-img-main .img-placeholder{font-size:72px;opacity:.55;}
.panel-img-main .img-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(26,22,18,0.45);border:none;color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:5;}
.panel-img-main .img-nav:hover{background:rgba(26,22,18,0.75);}
.panel-img-main .img-nav.prev{left:10px;}
.panel-img-main .img-nav.next{right:10px;}
.panel-img-main .img-counter{position:absolute;bottom:8px;right:10px;font-size:10px;color:rgba(245,240,232,0.6);letter-spacing:1px;background:rgba(26,22,18,0.4);padding:2px 7px;border-radius:10px;}
.panel-img-thumbs{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;align-items:center;}
.panel-img-thumbs::-webkit-scrollbar{height:3px;}
.panel-img-thumbs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.thumb-slot{position:relative;flex-shrink:0;}
.thumb-box{width:52px;height:52px;border-radius:var(--r);overflow:hidden;border:2px solid transparent;cursor:pointer;transition:border-color .15s;background:var(--paper3);display:flex;align-items:center;justify-content:center;font-size:22px;}
.thumb-box img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb-box.active{border-color:var(--accent);}
.thumb-box:hover{border-color:var(--accent2);}
.thumb-del{display:none;position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;font-size:9px;border:none;cursor:pointer;align-items:center;justify-content:center;line-height:1;z-index:2;}
.edit-thumbs .thumb-del{display:flex;}
.thumb-add{width:52px;height:52px;border-radius:var(--r);border:1.5px dashed var(--border);background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink3);font-size:18px;flex-shrink:0;transition:all .15s;font-family:'Noto Sans TC',sans-serif;}
.thumb-add:hover{border-color:var(--accent2);color:var(--accent);}
.thumb-add:disabled{opacity:.45;cursor:not-allowed;}
.thumb-add-lbl{font-size:8px;letter-spacing:1px;}
.drive-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--jade);text-decoration:none;padding:3px 8px;border:1px solid rgba(61,122,94,0.3);border-radius:20px;transition:all .15s;}
.drive-link:hover{background:rgba(61,122,94,0.08);}
.img-loading-bar{height:2px;background:var(--border);position:relative;overflow:hidden;}
.img-loading-bar::after{content:'';position:absolute;left:-40%;width:40%;height:100%;background:var(--jade);animation:imgload .9s linear infinite;}
@keyframes imgload{to{left:100%;}}
.panel-img-section{position:relative;}
.panel-img-section.drag-over{outline:3px dashed var(--accent2);outline-offset:-3px;}
.panel-img-section.drag-over::after{content:'拖曳圖片至此上傳';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:2px;color:var(--accent2);background:rgba(245,240,232,0.85);z-index:20;pointer-events:none;}
.panel-fields{padding:14px 16px;flex:1;}
.pfg{margin-bottom:12px;}
.pfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pfl{font-size:10px;letter-spacing:2px;color:var(--ink3);margin-bottom:4px;}
.pfv{font-size:13px;color:var(--ink);padding:5px 0;border-bottom:1px solid var(--border);min-height:26px;line-height:1.7;}
.pfv.multiline{line-height:1.8;}
.sbadge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;}
.psec{font-size:10px;letter-spacing:3px;color:var(--accent);padding:8px 0 6px;border-top:1px solid var(--border);margin-top:4px;}
.ffi{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--paper2);font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--ink);outline:none;transition:border-color .15s;}
.ffi:focus{border-color:var(--accent2);}
select.ffi{cursor:pointer;}
textarea.ffi{resize:vertical;min-height:72px;line-height:1.8;}
.pfv.highlight,.ffi.highlight{background:rgba(61,122,94,0.14)!important;border-color:var(--jade)!important;}
.pmeta{font-size:10px;color:var(--ink3);letter-spacing:1px;padding:8px 16px;background:var(--paper2);border-top:1px solid var(--border);}

/* ACTION BAR */
.act-bar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;}
.act-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border:1px solid var(--border);border-radius:var(--r);background:var(--paper2);cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:1px;color:var(--ink2);transition:all .15s;min-height:52px;justify-content:center;}
.act-btn:hover{border-color:var(--accent2);color:var(--accent);}
.act-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.act-btn.primary:hover{background:var(--accent2);border-color:var(--accent2);}
.act-btn.danger{color:#a32d2d;border-color:rgba(163,45,45,0.2);}
.act-btn.danger:hover{background:rgba(163,45,45,0.08);border-color:#a32d2d;}
.act-btn:disabled{opacity:.5;cursor:not-allowed;}
.act-btn-icon{font-size:18px;line-height:1;}
.btn-save{flex:1;background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:10px;font-family:'Noto Sans TC',sans-serif;font-size:13px;letter-spacing:2px;cursor:pointer;transition:background .15s;}
.btn-save:hover{background:var(--accent2);}
.btn-cancel{background:none;border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;font-family:'Noto Sans TC',sans-serif;font-size:13px;cursor:pointer;color:var(--ink2);}

/* FILING */
.sbar{background:var(--paper2);border-bottom:1px solid var(--border);padding:11px 20px;display:flex;align-items:center;overflow-x:auto;}
.sbar::-webkit-scrollbar{display:none;}
.si{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.sn{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid var(--border);color:var(--ink3);background:var(--paper);flex-shrink:0;}
.sn.done{background:var(--jade);border-color:var(--jade);color:#fff;}
.sn.cur{background:var(--accent);border-color:var(--accent);color:#fff;}
.sl{font-size:11px;letter-spacing:1px;color:var(--ink3);white-space:nowrap;}
.sl.cur{color:var(--accent);}
.sl.done{color:var(--jade);}
.sline{flex-shrink:0;width:14px;height:1px;background:var(--border);margin:0 3px;}
.cont{padding:16px 20px;}
.fl{font-size:10px;letter-spacing:2px;color:var(--ink3);margin-bottom:5px;}
.req{color:var(--accent);}
.fg{margin-bottom:14px;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.abar{display:flex;gap:10px;justify-content:flex-end;padding-top:14px;border-top:1px solid var(--border);margin-top:4px;}
.bp{background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:10px 22px;font-family:'Noto Sans TC',sans-serif;font-size:13px;cursor:pointer;transition:background .15s;}
.bp:hover{background:var(--accent2);}
.bp:disabled{background:var(--paper3);color:var(--ink3);cursor:not-allowed;}
.bs{background:none;color:var(--ink2);border:1px solid var(--border);border-radius:var(--r);padding:10px 16px;font-family:'Noto Sans TC',sans-serif;font-size:13px;cursor:pointer;}
.bai{background:rgba(61,122,94,0.1);color:var(--jade);border:1px solid rgba(61,122,94,0.35);border-radius:var(--r);padding:10px 22px;font-family:'Noto Sans TC',sans-serif;font-size:13px;cursor:pointer;}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.catbtn{border:1px solid var(--border);border-radius:var(--r);padding:14px 6px;text-align:center;cursor:pointer;background:var(--paper);transition:all .15s;}
.catbtn:hover{border-color:var(--accent2);}
.catbtn.sel{border-color:var(--accent);background:rgba(139,69,19,0.06);}
.fp-outer{background:var(--paper2);border:1px solid var(--border);border-radius:var(--r);padding:10px;margin-bottom:8px;}
.fp-orient{display:flex;justify-content:space-between;margin-bottom:6px;}
.fp-orient-label{font-size:9px;color:var(--ink3);letter-spacing:1px;}
.fp-room{background:#e8e0d0;border:2px solid #a09888;border-radius:2px;padding:8px 8px 0;display:flex;gap:8px;align-items:flex-start;}
.fp-left{display:flex;flex-direction:column;gap:4px;}
.fp-right{display:flex;flex-direction:column;gap:4px;margin-left:auto;}
.fp-aisle{flex:1;display:flex;align-items:center;justify-content:center;}
.fp-aisle-label{font-size:9px;color:rgba(26,22,18,0.2);letter-spacing:3px;writing-mode:vertical-rl;}
.fp-group{display:flex;align-items:center;gap:3px;}
.fp-group-label{font-size:8px;color:var(--ink3);width:22px;flex-shrink:0;text-align:right;}
.fp-2x2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;}
.cab-cell{width:26px;height:20px;background:var(--paper);border:1px solid rgba(26,22,18,0.18);border-radius:1px;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--ink3);cursor:pointer;transition:all .12s;user-select:none;}
.cab-cell:hover,.cab-cell.sel{background:rgba(139,69,19,0.22);border-color:var(--accent);color:var(--accent);}
.rack-cell{width:50px;height:20px;background:var(--paper);border:1px solid rgba(26,22,18,0.18);border-radius:1px;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--ink3);cursor:pointer;transition:all .12s;user-select:none;}
.rack-cell:hover,.rack-cell.sel{background:rgba(139,69,19,0.22);border-color:var(--accent);color:var(--accent);}
.fp-door{text-align:center;font-size:8px;color:var(--ink3);letter-spacing:2px;padding:5px 0 2px;border-top:1px dashed rgba(26,22,18,0.15);margin-top:6px;}
.lpanel{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid rgba(139,69,19,0.22);border-radius:var(--r);padding:8px 12px;margin-bottom:8px;}
.llbl{font-size:10px;letter-spacing:1px;color:var(--accent);flex-shrink:0;}
.lbtns{display:flex;gap:4px;}
.lbtn{min-width:38px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--r);background:var(--paper);font-family:'Noto Sans TC',sans-serif;font-size:11px;cursor:pointer;text-align:center;transition:all .12s;color:var(--ink2);}
.lbtn.sel{background:var(--accent);border-color:var(--accent);color:#fff;}
.lhint{font-size:10px;color:var(--ink3);}
.presult{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(139,69,19,0.06);border:1px solid rgba(139,69,19,0.22);border-radius:var(--r);margin-bottom:8px;}
.pcode{font-family:'Noto Serif TC',serif;font-size:16px;letter-spacing:3px;color:var(--accent);}
.pdesc{font-size:11px;color:var(--ink3);}
.pclr{margin-left:auto;font-size:11px;color:var(--ink3);cursor:pointer;text-decoration:underline;white-space:nowrap;}
.aibox{border:1px solid rgba(61,122,94,0.3);border-radius:var(--r);overflow:hidden;margin-bottom:14px;}
.aihdr{background:rgba(61,122,94,0.08);padding:9px 13px;display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:1px;color:var(--jade);}
.aibody{padding:13px;}
.ffi.aif{background:rgba(61,122,94,0.06);border-color:rgba(61,122,94,0.4);}
.abadge{display:inline-flex;font-size:10px;color:var(--jade);background:rgba(61,122,94,0.1);padding:1px 6px;border-radius:10px;margin-left:5px;}
.uzn{border:2px dashed var(--border);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;transition:all .15s;}
.uzn:hover{border-color:var(--accent2);}
.uzn.has{border-color:var(--jade);border-style:solid;}
.uzn.drag-over-file{border-color:var(--accent2);background:rgba(196,125,62,0.06);}

/* SETUP SCREEN */
.setup-screen{padding:24px 20px;}
.setup-title{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:300;letter-spacing:3px;margin-bottom:6px;}
.setup-sub{font-size:12px;color:var(--ink3);margin-bottom:24px;line-height:1.8;}
.setup-step{display:flex;gap:12px;margin-bottom:16px;padding:12px 14px;background:var(--paper2);border-radius:var(--r);border:1px solid var(--border);}

.setup-url-row{display:flex;gap:8px;margin-top:20px;}
.setup-url-input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--paper);font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--ink);outline:none;}

.setup-url-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:9px 18px;font-family:'Noto Sans TC',sans-serif;font-size:13px;cursor:pointer;white-space:nowrap;}

/* CAMERA FAB */
.cam-fab{position:fixed;bottom:24px;right:max(16px,calc(50% - 340px + 16px));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(139,69,19,0.4);display:flex;align-items:center;justify-content:center;z-index:50;transition:background .15s,transform .15s;}
.cam-fab:hover{background:var(--accent2);transform:scale(1.05);}
.cam-fab:active{transform:scale(0.95);}

/* QUICK FILE SHEET */
.qf-backdrop{display:none;position:fixed;inset:0;background:rgba(26,22,18,0.52);z-index:200;}

.qf-sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(105%);width:min(680px,100%);max-height:94vh;background:var(--paper);border-radius:16px 16px 0 0;box-shadow:0 -4px 32px rgba(26,22,18,0.18);z-index:201;display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.32,.72,0,1);overflow:hidden;}
.qf-sheet.open{transform:translateX(-50%) translateY(0);}
.qf-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 2px;flex-shrink:0;}
.qf-header{padding:6px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.qf-title{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:300;letter-spacing:3px;color:var(--ink);}
.qf-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink3);padding:4px 6px;line-height:1;}

.qf-photos{background:#0e0e0e;height:220px;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qf-photos img{height:100%;width:100%;object-fit:contain;display:block;}
.qf-photos .qf-ph-empty{font-size:64px;opacity:.2;}
.qf-photo-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:20px;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qf-photo-nav.prev{left:8px;}.qf-photo-nav.next{right:8px;}
.qf-photo-counter{position:absolute;bottom:7px;right:10px;font-size:10px;color:rgba(255,255,255,0.55);background:rgba(0,0,0,0.35);padding:2px 7px;border-radius:10px;letter-spacing:1px;}
.qf-thumbs{display:flex;gap:6px;padding:8px 12px;background:var(--paper2);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;}

.qf-thumb{width:44px;height:44px;border-radius:var(--r);overflow:hidden;border:2px solid transparent;cursor:pointer;flex-shrink:0;background:var(--paper3);}
.qf-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.qf-thumb.active{border-color:var(--accent);}
.qf-thumb-add{width:44px;height:44px;border-radius:var(--r);border:1.5px dashed var(--border);background:none;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;color:var(--ink3);cursor:pointer;gap:1px;font-family:'Noto Sans TC',sans-serif;}

.qf-form{padding:14px 16px 8px;}
.qf-sec{font-size:10px;letter-spacing:3px;color:var(--accent);margin:16px 0 8px;border-top:1px solid var(--border);padding-top:10px;}

.qf-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:4px;}

.qf-cat.sel{border-color:var(--accent);background:rgba(139,69,19,0.06);}
.qf-cat-e{font-size:20px;line-height:1.2;}
.qf-cat-k{font-size:10px;letter-spacing:1px;color:var(--accent);font-weight:500;margin-top:2px;}

.qf-loc-row{display:flex;gap:8px;}

.qf-locpicker{background:var(--paper2);border:1px solid var(--border);border-radius:var(--r);padding:10px;margin-top:8px;}

.qf-fg{margin-bottom:12px;}
.qf-lbl{font-size:10px;letter-spacing:2px;color:var(--ink3);margin-bottom:4px;}
.qf-ai-bar{background:rgba(61,122,94,0.08);border:1px solid rgba(61,122,94,0.3);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px;cursor:pointer;}
.qf-ai-lbl{font-size:12px;color:var(--jade);letter-spacing:1px;}
.qf-ai-hint{font-size:10px;color:var(--ink3);}
.qf-ai-fields{border:1px solid rgba(61,122,94,0.25);border-radius:var(--r);overflow:hidden;margin-bottom:12px;}

.qf-cancel{background:none;border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;font-family:'Noto Sans TC',sans-serif;font-size:13px;cursor:pointer;color:var(--ink2);}

/* DELETE CONFIRM */
.del-confirm{position:fixed;inset:0;background:rgba(26,22,18,0.55);z-index:200;display:flex;align-items:center;justify-content:center;}

/* LABEL MODAL */
.lbl-modal{position:fixed;inset:0;background:rgba(26,22,18,0.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;}

.lbl-canvas-wrap{background:#fff;border:1px solid var(--border);border-radius:2px;display:inline-block;box-shadow:0 2px 8px rgba(26,22,18,0.12);}

.lbl-dl{flex:1;background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:11px;font-family:'Noto Sans TC',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;transition:background .15s;}

<body>
<div id="app">
  <div class="header">

</div>

<script>
/* ========== CONFIG & API ========== */

var WEBAPP_URL = localStorage.getItem('dbWebappUrl') || '';
var DEMO_MODE  = false; // 無 URL 時使用範例資料

var dataCache = { loaded: false, items: [] };

function apiGet(params, cb) {
  var url = WEBAPP_URL + '?' + Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k]);}).join('&');
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(d){ cb(d.ok ? null : (d.error||'錯誤'), d); })
    .catch(function(e){ cb(e.message||'網路錯誤', null); });
}

function apiPost(payload, cb) {
  fetch(WEBAPP_URL, { method:'POST', body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(d){ cb(d.ok ? null : (d.error||'錯誤'), d); })
    .catch(function(e){ cb(e.message||'網路錯誤', null); });
}

function showSaving(text) {
  var el = document.getElementById('apiSaving');
  el.textContent = text || '儲存中⋯';
  el.classList.add('show');
}
function hideSaving() {
  document.getElementById('apiSaving').classList.remove('show');
}

function loadItems(force, cb) {
  if (!WEBAPP_URL || DEMO_MODE) {
    if (!dataCache.loaded) { dataCache.items = DEMO_ITEMS.slice(); dataCache.loaded = true; }
    cb(null);
    return;
  }
  if (dataCache.loaded && !force) { cb(null); return; }
  apiGet({ action:'list', cat:'all' }, function(err, data) {
    if (err) { cb(err); return; }
    dataCache.items = data.items || [];
    dataCache.loaded = true;
    items = dataCache.items;
    cb(null);
  });
}

/* ========== DATA ========== */

var condColor = {'完整':'#3d7a5e','有衝':'#ba7517','有破':'#a32d2d','有汙':'#ba7517','有破損':'#a32d2d','有裂':'#ba7517','有損':'#a32d2d'};
var CAB_NAMES = {A:'左前',B:'右前',C:'左後',D:'右後'};
var CATS      = {CQ:{n:'瓷器',e:'🏺'},ZH:{n:'字畫',e:'🖌️'},YQ:{n:'玉器',e:'💚'},ZX:{n:'雜項',e:'⚗️'}};
var CAT_COLORS= {CQ:'#d4e8f0',ZH:'#f0e4d0',YQ:'#e8f0e0',ZX:'#f0e8d0'};
var CAT_FIELD_LABELS = {
  CQ:{f2:'朝代',f3:'窯口',f4:'工藝／裝飾',desc_hint:'簡述（含紋飾、底款）'},
  ZH:{f2:'年代', f3:'作者',f4:'型式與媒材',desc_hint:'簡述（引首、鈐印、跋）'},
  YQ:{f2:'年代', f3:'玉種',f4:'器型',        desc_hint:'簡述'},
  ZX:{f2:'年代', f3:'媒材',f4:'型制',         desc_hint:'簡述'},
};
var COND_OPTS = {CQ:['完整','有衝','有破'],ZH:['完整','有汙','有破損'],YQ:['完整','有裂','有破損'],ZX:['完整','有損']};
var AI_MOCK   = {
  CQ:{dynasty:'清代（推測）',kiln:'景德鎮窯',craft:'青花',desc:'器身以青花繪山水紋飾，用筆流暢，發色純正。頸部飾如意紋一週，腹部主紋為山石林木。底款書「大清乾隆年製」楷書款，字體工整。'},
  ZH:{dynasty:'民國（推測）',kiln:'佚名',craft:'水墨紙本',desc:'水墨山水，筆墨疏秀，皴法以披麻皴為主。引首鈐朱文印一方，款識書於左下角。'},
  YQ:{dynasty:'清代（推測）',kiln:'青白玉',craft:'薄胎陰線',desc:'玉質細膩，微帶青色。器表陰線飾卷草紋，線條流暢均勻。底部無款。'},
  ZX:{dynasty:'明代（推測）',kiln:'銅',craft:'失蠟鑄造',desc:'銅鑄造，表面有自然包漿，局部殘留鎏金痕跡。造型端正，比例協調。底部有鑄款。'},
};

var DEMO_ITEMS = [
  {id:'CQ-1150429-001',cat:'CQ',name:'青花纏枝蓮紋大罐',dynasty:'明代',kiln:'景德鎮窯',craft:'青花',size:'口徑14／腹徑32／高38cm',cond:'完整',desc:'通體以青花繪纏枝蓮紋，底款書「大明宣德年製」楷書款。',price:'NT$ 380,000',loc:'L-01-A-2',note:'品相完好，釉色溫潤',color:'#d4e8f0',emoji:'🏺',images:['🏺','🏺','🏺'],folderId:'',folderUrl:'',isNew:false},
  {id:'CQ-1150429-002',cat:'CQ',name:'粉彩花鳥紋膽瓶',dynasty:'清代',kiln:'景德鎮窯',craft:'粉彩',size:'口徑3／底徑7／高28cm',cond:'有衝',desc:'瓶身以粉彩繪折枝花卉及飛鳥，口沿有衝線約1cm。',price:'NT$ 120,000',loc:'L-01-B-3',note:'口沿衝線已標記',color:'#f0e8d4',emoji:'🪷',images:['🪷','🪷'],folderId:'',folderUrl:'',isNew:false},
  {id:'ZH-1150429-001',cat:'ZH',name:'溥心畬山水冊頁',dynasty:'民國',kiln:'溥心畬',craft:'水墨紙本',size:'24×32cm×12頁',cond:'完整',desc:'十二頁山水冊頁，筆墨疏秀，意境清遠。',price:'NT$ 180,000',loc:'L-03-A-2',note:'12頁全冊，附原裝錦盒',color:'#f0e4d0',emoji:'🖌️',images:['🖌️','🖌️'],folderId:'',folderUrl:'',isNew:false},
  {id:'YQ-1150429-001',cat:'YQ',name:'白玉壽星擺件',dynasty:'清代',kiln:'和田白玉',craft:'圓雕',size:'高18cm',cond:'完整',desc:'白玉質細膩，雕壽星老翁，手持壽桃，雕工精細。',price:'NT$ 95,000',loc:'R-03-2',note:'含木質底座',color:'#e8f0e0',emoji:'💚',images:['💚','💚'],folderId:'',folderUrl:'',isNew:false},
  {id:'ZX-1150429-001',cat:'ZX',name:'銅鎏金觀音像',dynasty:'明代',kiln:'銅鎏金',craft:'失蠟鑄造',size:'高32cm',cond:'完整',desc:'觀音結跏趺坐，全身鎏金保存完好。蓮座下鑄「大明萬曆年施」款。',price:'NT$ 320,000',loc:'R-04-1',note:'鎏金完整，品相極佳',color:'#f0e8d0',emoji:'⚗️',images:['⚗️','⚗️'],folderId:'',folderUrl:'',isNew:false},
];

var items = [];

/* ========== STATE ========== */

var mode       = 'browse';
var currentCat = 'all';
var currentItem= null;
var editMode   = false;
var changedKeys= [];
var viewImgIdx = 0;
var driveImages= [];   // [{id,name,thumb,url}] loaded lazily for currentItem
var imgsLoading= false;
var batchMode     = false;
var batchSelected = new Set();
var FS = {step:1,cat:'',photo:false,photoFiles:[],photoPreviewUrls:[],photoCompressed:[],aiDone:false,aiLoad:false,selCab:null,selLayer:null,loc:'',name:'',size:'',cond:'',dynasty:'',kiln:'',craft:'',desc:'',price:'',note:'',newId:'',newFolderId:'',newFolderUrl:''};

/* ========== INIT ========== */

document.getElementById('tabBrowse').addEventListener('click',function(){switchMode('browse');});
document.getElementById('tabFile').addEventListener('click',function(){switchMode('file');});
document.getElementById('hsetupBtn').addEventListener('click',function(){showSetup();});

function init() {
  // 處理 QR code 掃描：?id=CQ-1150429-001
  var urlParams = new URLSearchParams(window.location.search);
  var deepId    = urlParams.get('id');

  if (!WEBAPP_URL) {
    showSetup();
  } else {
    renderBrowse();
    initFileMode();
    document.getElementById('fileMode').style.display = 'none';
  }

  // 若有 deep link id，等資料載入後開啟
  if (deepId) {
    loadItems(false, function(err) {
      if (err) return;
      var found = dataCache.items.find(function(i){ return i.id === deepId; });
      if (found) {
        // 若剛才進 setupScreen，先切到 browse
        if (WEBAPP_URL) {
          document.getElementById('browseMode').style.display = '';
          document.getElementById('fileMode').style.display   = 'none';
          document.getElementById('tabBrowse').className = 'tab on';
          document.getElementById('tabFile').className   = 'tab';
          mode = 'browse';
        }
        openDetail(deepId);
      }
    });
  }
}

/* ========== SETUP SCREEN ========== */

function showSetup() {
  document.getElementById('browseMode').innerHTML = renderSetupHtml();
  document.getElementById('fileMode').style.display = 'none';
  document.getElementById('tabBrowse').className = 'tab on';
  document.getElementById('tabFile').className = 'tab';
  mode = 'browse';
  bindSetup();
}

function renderSetupHtml() {
  return '<div class="setup-screen">'
    +'<div class="setup-title">連線設定</div>'
    +'<div class="setup-sub">請依照以下步驟建立 Google Sheets 資料庫，完成後貼上 Web App URL 即可開始使用。</div>'
    +'<div class="setup-step"><div class="setup-step-num">1</div><div class="setup-step-body">前往 <b>Google 雲端硬碟</b>，新增一份 <b>Google 試算表</b>，命名為「迪化街典藏資料庫」</div></div>'

function bindSetup() {
  document.getElementById('setupSaveBtn').addEventListener('click', function(){
    var url = (document.getElementById('setupUrlInput').value || '').trim();
    var errEl = document.getElementById('setupError');
    if (!url || url.indexOf('script.google.com') < 0) {
      errEl.textContent = '請貼入正確的 Web App URL（應包含 script.google.com）';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    document.getElementById('setupSaveBtn').textContent = '測試中⋯';
    document.getElementById('setupSaveBtn').disabled = true;
    // Test connection
    fetch(url + '?action=list&cat=CQ')
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.ok !== undefined) {
          localStorage.setItem('dbWebappUrl', url);
          WEBAPP_URL = url;
          DEMO_MODE  = false;
          dataCache  = { loaded: false, items: [] };
          renderBrowse();
          initFileMode();
          document.getElementById('fileMode').style.display = 'none';
        } else {
          throw new Error('回應格式不正確');
        }
      })
      .catch(function(e){
        errEl.textContent = '連線失敗：' + (e.message || '請確認 URL 是否正確、部署設定是否為「所有人」');
        errEl.style.display = 'block';
        document.getElementById('setupSaveBtn').textContent = '確認連線';
        document.getElementById('setupSaveBtn').disabled = false;
      });
  });
  document.getElementById('setupDemoBtn').addEventListener('click', function(){
    DEMO_MODE = true;
    dataCache = { loaded: false, items: [] };
    renderBrowse();
    initFileMode();
    document.getElementById('fileMode').style.display = 'none';
  });
}

function switchMode(m) {
  mode = m;
  document.getElementById('tabBrowse').className = 'tab'+(m==='browse'?' on':'');
  document.getElementById('tabFile').className   = 'tab'+(m==='file'?' on':'');
  document.getElementById('browseMode').style.display = m==='browse'?'':'none';
  document.getElementById('fileMode').style.display   = m==='file'?'':'none';
  if (m==='browse') renderBrowse();
  else initFileMode();
}

/* ========== BROWSE MODE ========== */

function renderBrowse(q, noReload) {
  q = q || '';
  var browseEl = document.getElementById('browseMode');

  if (!dataCache.loaded && !noReload) {
    browseEl.innerHTML = '<div class="loading-screen"><div class="spinner"></div><div style="font-size:12px;color:var(--ink3);letter-spacing:1px">載入典藏資料中⋯</div></div>';
    loadItems(false, function(err) {
      if (err) {
        browseEl.innerHTML = '<div style="padding:16px"><div class="error-bar"><span class="error-msg">⚠ 載入失敗：'+escHtml(err)+'</span><span class="error-retry" id="retryBtn">重試</span></div></div>';
        document.getElementById('retryBtn')&&document.getElementById('retryBtn').addEventListener('click',function(){renderBrowse(q);});
        return;
      }
      renderBrowse(q, true);
      lazyCoverLoad();
    });
    return;
  }

  items = dataCache.items;

  var filtered = items.filter(function(i) {
    var catOk = currentCat==='all' || i.cat===currentCat;
    var qOk = !q || [i.name,i.dynasty,i.kiln,i.craft,i.loc,i.id,i.desc,i.note].some(function(v){
      return v && v.toLowerCase().indexOf(q.toLowerCase())>=0;
    });
    return catOk && qOk;
  });

  var cats = ['all','CQ','ZH','YQ','ZX'];
  var catLabels = {all:'全部',CQ:'CQ 瓷器',ZH:'ZH 字畫',YQ:'YQ 玉器',ZX:'ZX 雜項'};
  var catBar = '<div class="catbar">'+cats.map(function(c){
    var cnt = c==='all'?items.length:items.filter(function(i){return i.cat===c;}).length;
    return '<button class="catf'+(currentCat===c?' on':'')+'" data-cat="'+c+'">'+catLabels[c]+' <span style="opacity:.5">'+cnt+'</span></button>';
  }).join('')+'</div>';

  var modeNote = (DEMO_MODE && !WEBAPP_URL)
    ? '<div style="background:rgba(196,125,62,0.1);border-bottom:1px solid rgba(196,125,62,0.2);padding:7px 16px;font-size:11px;color:var(--accent2)">離線範例模式 — <span style="cursor:pointer;text-decoration:underline" id="goSetupLink">點此連線 Google Sheets</span></div>'
    : '';

  var grid = filtered.length===0
    ? '<div class="empty"><div style="font-size:28px;margin-bottom:8px">🔍</div><div>查無符合品項</div></div>'
    : '<div class="grid">'+filtered.map(function(item){
        var clr = item.color || CAT_COLORS[item.cat] || '#e0d8c8';
        var emj = item.emoji || CATS[item.cat].e;
        var cardImgInner = item.coverThumb
          ? '<img src="'+escHtml(item.coverThumb)+'" alt="" loading="lazy" onerror="this.remove()">' + emj
          : emj;
        var isSel = batchMode && batchSelected.has(item.id);
        return '<div class="card'+(isSel?' b-sel':'')+'" data-id="'+item.id+'">'
          +(batchMode?'<div class="batch-chk">'+(isSel?'✓':'')+'</div>':'')
          +(item.isNew?'<div class="new-badge">新建</div>':'')
          +'<div class="card-img" style="background:'+clr+'28">'+cardImgInner+'</div>'
          +'<div class="card-body"><div class="card-id">'+item.id+'</div>'
          +'<div class="card-name">'+hlText(item.name, q)+'</div>'
          +'<div class="card-meta"><span>'+hlText(item.dynasty, q)+'</span>'
          +'<span><span class="sdot" style="background:'+(condColor[item.cond]||'#888')+'"></span>'+escHtml(item.cond)+'</span>'
          +'</div></div></div>';
      }).join('')+'</div>';

  var batchBar = batchMode
    ? '<div class="batch-bar">'
      +'<button class="bbtn" id="batchCancel">取消</button>'
      +'<span class="batch-info">已選 <b>'+batchSelected.size+'</b> 件</span>'
      +'<button class="bbtn" id="batchSelAll">全選('+(filtered.length)+')</button>'
      +'<button class="bbtn" id="batchCsv"'+(batchSelected.size?'':' disabled')+'>📄 匯出 CSV</button>'
      +'<button class="bbtn primary" id="batchPrint"'+(batchSelected.size?'':' disabled')+'>🖨 列印 '+batchSelected.size+' 張</button>'
      +'</div>'
    : '';

  browseEl.innerHTML = catBar + modeNote + batchBar
    + '<div class="toolbar"><div class="search-wrap"><span class="search-icon">⌕</span>'
    + '<input id="searchInput" type="text" placeholder="搜尋品名、朝代、位置…" value="'+escHtml(q)+'"></div>'
    + '<div class="count">'+filtered.length+' 件</div>'
    + '<button class="tbatch'+(batchMode?' on':'')+'" id="batchToggle">'+(batchMode?'✕':'🖨')+'</button>'
    + '</div>'
    + grid;

  document.getElementById('searchInput').addEventListener('input',function(){renderBrowse(this.value, true);});
  document.querySelectorAll('.catf').forEach(function(el){
    el.addEventListener('click',function(){
      currentCat=this.getAttribute('data-cat');
      renderBrowse(document.getElementById('searchInput')?document.getElementById('searchInput').value:'', true);
    });
  });
  var batchToggleEl=document.getElementById('batchToggle');
  if(batchToggleEl) batchToggleEl.addEventListener('click',function(){
    batchMode=!batchMode; if(!batchMode) batchSelected.clear();
    renderBrowse(document.getElementById('searchInput')?document.getElementById('searchInput').value:'', true);
  });
  var batchCancelEl=document.getElementById('batchCancel');
  if(batchCancelEl) batchCancelEl.addEventListener('click',function(){
    batchMode=false; batchSelected.clear();
    renderBrowse(document.getElementById('searchInput')?document.getElementById('searchInput').value:'', true);
  });
  var batchSelAllEl=document.getElementById('batchSelAll');
  if(batchSelAllEl) batchSelAllEl.addEventListener('click',function(){
    filtered.forEach(function(i){batchSelected.add(i.id);});
    renderBrowse(document.getElementById('searchInput')?document.getElementById('searchInput').value:'', true);
  });
  var batchCsvEl=document.getElementById('batchCsv');
  if(batchCsvEl && !batchCsvEl.disabled) batchCsvEl.addEventListener('click', exportBatchCsv);
  var batchPrintEl=document.getElementById('batchPrint');
  if(batchPrintEl && !batchPrintEl.disabled) batchPrintEl.addEventListener('click', printBatchLabels);
  document.querySelectorAll('.card').forEach(function(el){
    el.addEventListener('click',function(){
      var id=this.getAttribute('data-id');
      if(batchMode){
        if(batchSelected.has(id)) batchSelected.delete(id); else batchSelected.add(id);
        renderBrowse(document.getElementById('searchInput')?document.getElementById('searchInput').value:'', true);
      } else { openDetail(id); }
    });
  });
  var goSetup = document.getElementById('goSetupLink');
  if (goSetup) goSetup.addEventListener('click', showSetup);
}

function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function hlText(s, q) {
  var safe = escHtml(s||'');
  if (!q || q.length < 1) return safe;
  var eq = escHtml(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return safe.replace(new RegExp('('+eq+')', 'gi'), '<mark>$1</mark>');
}

// 懶加載封面：找出有 folderId 但無 coverThumb 的品項，逐一抓第一張圖
function lazyCoverLoad() {
  if (!WEBAPP_URL || DEMO_MODE) return;
  var pending = dataCache.items.filter(function(i){ return i.folderId && !i.coverThumb; });
  if (!pending.length) return;
  var idx = 0;
  function next() {
    if (idx >= pending.length) return;
    var item = pending[idx++];
    apiGet({ action:'images', itemId:item.id }, function(err, data) {
      if (!err && data && data.images && data.images.length) {
        var thumb = data.images[0].thumb;
        // 更新 cache
        item.coverThumb = thumb;
        var cIdx = dataCache.items.findIndex(function(i){ return i.id === item.id; });
        if (cIdx >= 0) dataCache.items[cIdx].coverThumb = thumb;
        // 直接更新卡片 DOM，不用重新 render 整個 grid
        var cardImg = document.querySelector('.card[data-id="'+item.id+'"] .card-img');
        if (cardImg && !cardImg.querySelector('img')) {
          var imgEl = document.createElement('img');
          imgEl.src = thumb;
          imgEl.onerror = function(){ this.remove(); };
          cardImg.insertBefore(imgEl, cardImg.firstChild);
        }
        // 寫回 Sheets 第 15 欄（靜默，不等回應）
        if (WEBAPP_URL) apiPost({ action:'setCover', itemId:item.id, thumb:thumb }, function(){});
      }
      setTimeout(next, 300); // 每 300ms 一筆，避免同時打太多請求
    });
  }
  next();
}

/* ========== DETAIL PANEL ========== */

function itemColor(item){ return item.color || CAT_COLORS[item.cat] || '#e0d8c8'; }
function itemEmoji(item){ return item.emoji || CATS[item.cat].e; }

function openDetail(id){
  currentItem = dataCache.items.find(function(i){return i.id===id;});
  if (!currentItem) return;
  editMode=false; changedKeys=[]; viewImgIdx=0; driveImages=[];
  renderPanel();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('overlay').onclick = function(e){if(e.target===this)closeDetail();};
  // 載入 Drive 圖片（若有資料夾）
  if (currentItem.folderId && WEBAPP_URL && !DEMO_MODE) {
    loadDriveImages(currentItem.id);
  }
}
function closeDetail(){
  document.getElementById('overlay').classList.remove('open');
  editMode=false; changedKeys=[]; driveImages=[]; imgsLoading=false;
}

function loadDriveImages(itemId) {
  imgsLoading = true;
  updateImgStrip();
  apiGet({ action:'images', itemId:itemId }, function(err, data) {
    imgsLoading = false;
    if (err || !data) { updateImgStrip(); return; }
    driveImages = data.images || [];
    if (viewImgIdx >= driveImages.length && driveImages.length > 0) viewImgIdx = 0;
    updateImgStrip();
  });
}

function updateImgStrip() {
  var mainEl  = document.getElementById('panelImgMain');
  var thumbEl = document.getElementById('panelImgs');
  if (!mainEl || !thumbEl) return;

  var d   = currentItem;
  var clr = itemColor(d);
  var emj = itemEmoji(d);

  // Loading bar
  var loadBar = document.getElementById('imgLoadBar');
  if (loadBar) loadBar.style.display = imgsLoading ? 'block' : 'none';

  var hasDrive = driveImages && driveImages.length > 0;
  var showImgs = hasDrive ? driveImages : (d.images && d.images.length ? d.images : [emj]);
  var total    = showImgs.length;
  if (viewImgIdx >= total) viewImgIdx = Math.max(0, total - 1);

  // ── 大圖區 ──
  var mainInner = '';
  if (total > 0) {
    var cur = showImgs[viewImgIdx];
    if (hasDrive) {
      mainInner = '<img src="'+cur.thumb+'" alt="'+escHtml(cur.name)+'" onerror="this.style.display=\'none\'">';
    } else {
      mainInner = '<span class="img-placeholder">'+cur+'</span>';
    }
    if (total > 1) {
      mainInner += '<button class="img-nav prev" id="imgPrev">‹</button>'
                 + '<button class="img-nav next" id="imgNext">›</button>';
    }
    mainInner += '<span class="img-counter">'+(viewImgIdx+1)+' / '+total+'</span>';
  } else {
    mainInner = '<span class="img-placeholder">'+emj+'</span>';
  }
  mainEl.innerHTML = mainInner;
  mainEl.style.background = hasDrive ? '#1a1612' : clr+'18';

  // nav buttons
  var prevBtn = document.getElementById('imgPrev');
  var nextBtn = document.getElementById('imgNext');
  if (prevBtn) prevBtn.onclick = function(e){ e.stopPropagation(); viewImgIdx=(viewImgIdx-1+total)%total; updateImgStrip(); };
  if (nextBtn) nextBtn.onclick = function(e){ e.stopPropagation(); viewImgIdx=(viewImgIdx+1)%total; updateImgStrip(); };

  // 大圖點擊 → 開新分頁（Drive 圖片）
  if (hasDrive && showImgs[viewImgIdx]) {
    mainEl.onclick = function(){ window.open(showImgs[viewImgIdx].url, '_blank'); };
    mainEl.title = '點擊開啟原圖';
  } else {
    mainEl.onclick = null;
    mainEl.title = '';
  }

  // ── 縮圖列 ──
  var thumbHtml = '';
  showImgs.forEach(function(img, idx){
    var active = idx === viewImgIdx;
    var inner  = hasDrive
      ? '<img src="'+img.thumb+'" alt="'+escHtml(img.name)+'" loading="lazy" onerror="this.style.display=\'none\'">'
      : '<span style="font-size:22px">'+img+'</span>';
    thumbHtml += '<div class="thumb-slot">'
      + '<div class="thumb-box'+(active?' active':'')+'" data-imgidx="'+idx+'" style="background:'+clr+'22">'+inner+'</div>'
      + (editMode && hasDrive ? '<button class="thumb-del" data-delidx="'+idx+'" data-fileid="'+escHtml(img.id||'')+'">✕</button>' : '')
      + (editMode && !hasDrive && total > 1 ? '<button class="thumb-del" data-delidx="'+idx+'">✕</button>' : '')
      + '</div>';
  });
  if (editMode) {
    thumbHtml += '<button class="thumb-add" id="imgAddBtn"'+(imgsLoading?' disabled':'')+' title="上傳圖片">'
      + '<span>＋</span><span class="thumb-add-lbl">新增</span></button>';
  }

  thumbEl.innerHTML = thumbHtml;
  thumbEl.className = 'panel-img-thumbs' + (editMode ? ' edit-thumbs' : '');
  // 隱藏縮圖列（若只有 1 張且非編輯模式）
  thumbEl.style.display = (total <= 1 && !editMode) ? 'none' : '';

  // 縮圖點擊
  thumbEl.querySelectorAll('.thumb-box[data-imgidx]').forEach(function(el){
    el.onclick = function(){ viewImgIdx = parseInt(this.getAttribute('data-imgidx')); updateImgStrip(); };
  });

  // 刪除按鈕
  if (editMode) {
    thumbEl.querySelectorAll('.thumb-del').forEach(function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        var idx    = parseInt(this.getAttribute('data-delidx'));
        var fileId = this.getAttribute('data-fileid');
        if (fileId && WEBAPP_URL && !DEMO_MODE) {
          if (!confirm('刪除此圖片？')) return;
          this.disabled = true;
          apiPost({action:'deleteImage', fileId:fileId}, function(err){
            if (err) { alert('刪除失敗：'+err); return; }
            driveImages.splice(idx, 1);
            if (viewImgIdx >= driveImages.length && driveImages.length > 0) viewImgIdx = 0;
            updateImgStrip();
          });
        } else {
          if (!currentItem.images || currentItem.images.length <= 1) return;
          currentItem.images.splice(idx, 1);
          if (viewImgIdx >= currentItem.images.length) viewImgIdx = currentItem.images.length - 1;
          updateImgStrip();
        }
      };
    });

    var addBtn = document.getElementById('imgAddBtn');
    if (addBtn) addBtn.onclick = function(){ document.getElementById('imgFileInput').click(); };
  }
}

function renderPanel(){
  var d   = currentItem;
  var lbl = CAT_FIELD_LABELS[d.cat] || CAT_FIELD_LABELS.CQ;
  var condOpts = COND_OPTS[d.cat] || COND_OPTS.CQ;
  var clr = itemColor(d);
  var emj = itemEmoji(d);

  var fields = [
    {row:[{label:'位置',key:'loc',type:'text'},{label:'品像',key:'cond',type:'select',opts:condOpts}]},
    {sec:'品項資訊'},
    {key:'name',label:'品項名稱',type:'text'},
    {row:[{label:lbl.f2,key:'dynasty',type:'text'},{label:lbl.f3,key:'kiln',type:'text'}]},
    {row:[{label:lbl.f4,key:'craft',type:'text'},{label:'尺寸',key:'size',type:'text'}]},
    {sec:'詳細說明'},
    {key:'desc',label:lbl.desc_hint,type:'textarea'},
    {sec:'市場參考'},
    {row:[{label:'參考價',key:'price',type:'text'},{label:'備註',key:'note',type:'text'}]},
  ];

  // 圖片區域（updateImgStrip 稍後填入真實內容）
  var imgHtml = '<div class="panel-img-section" id="panelImgSection">'
    + '<div id="imgLoadBar" class="img-loading-bar" style="display:none"></div>'
    + '<div class="panel-img-main" id="panelImgMain"></div>'
    + '<div class="panel-img-thumbs" id="panelImgs"></div>'
    + '</div>'
    + '<input type="file" id="imgFileInput" accept="image/*" multiple style="display:none">';

  // Drive link
  var driveHtml = '';
  if (d.folderUrl) {
    driveHtml = '<div style="padding:8px 16px;background:var(--paper2);border-bottom:1px solid var(--border)">'
      +'<a class="drive-link" href="'+d.folderUrl+'" target="_blank">📁 查看 Drive 圖片資料夾</a></div>';
  }

  var fieldsHtml = '<div class="panel-fields">';
  fields.forEach(function(f){
    if(f.sec!==undefined){fieldsHtml+='<div class="psec">'+f.sec+'</div>';return;}
    if(f.row) fieldsHtml+='<div class="pfrow">'+f.row.map(function(rf){return renderField(rf,d);}).join('')+'</div>';
    else fieldsHtml+=renderField(f,d);
  });
  fieldsHtml += '</div>';

  // Meta info
  var metaHtml = '';
  if (d.updatedAt || d.createdAt) {
    metaHtml = '<div class="pmeta">'
      +(d.createdAt?'建立：'+d.createdAt+'　':'')
      +(d.updatedAt?'更新：'+d.updatedAt:'')
      +'</div>';
  }

  var actHtml = !editMode
    ? '<div class="act-bar"><button class="act-btn" id="copyBtn"><span class="act-btn-icon">📋</span><span>複製資訊</span></button><button class="act-btn" id="labelBtn"><span class="act-btn-icon">🏷</span><span>標籤</span></button><button class="act-btn primary" id="editBtn"><span class="act-btn-icon">✏️</span><span>編輯</span></button><button class="act-btn danger" id="deleteBtn"><span class="act-btn-icon">🗑</span><span>刪除</span></button></div>'
    : '<div class="act-bar"><button class="act-btn" id="cancelBtn" style="flex:.6"><span class="act-btn-icon">✕</span><span>取消</span></button><button class="act-btn primary" id="saveBtn" style="flex:1.4"><span class="act-btn-icon">💾</span><span>儲存變更</span></button></div>';

  document.getElementById('panel').innerHTML =
    '<div class="panel-header"><div class="panel-id"><span style="color:rgba(245,240,232,0.35);margin-right:6px">'+CATS[d.cat].e+'</span>'+d.id+'</div>'
    +'<button class="pbtn-close" id="closeBtn">✕</button></div>'
    + imgHtml + driveHtml + fieldsHtml + metaHtml + actHtml;

  document.getElementById('closeBtn').onclick = closeDetail;

  // Populate image strip
  updateImgStrip();

  // File input handler for uploading images
  var fileInput = document.getElementById('imgFileInput');
  if (fileInput) {
    fileInput.onchange = function(){
      var files = Array.prototype.slice.call(this.files);
      if (!files.length) return;
      uploadFiles(files);
      this.value = '';
    };
  }

  // 拖曳上傳
  var imgSection = document.getElementById('panelImgSection');
  if (imgSection) {
    imgSection.addEventListener('dragover', function(e){
      e.preventDefault();
      e.stopPropagation();
      if (editMode) imgSection.classList.add('drag-over');
    });
    imgSection.addEventListener('dragleave', function(e){
      if (!imgSection.contains(e.relatedTarget)) imgSection.classList.remove('drag-over');
    });
    imgSection.addEventListener('drop', function(e){
      e.preventDefault();
      e.stopPropagation();
      imgSection.classList.remove('drag-over');
      if (!editMode) return;
      var files = Array.prototype.slice.call(e.dataTransfer.files).filter(function(f){ return f.type.indexOf('image/') === 0; });

/* ========== DRIVE IMAGE UPLOAD ========== */

function uploadFiles(files) {
  if (!files || !files.length) return;
  var addBtn = document.getElementById('imgAddBtn');
  if (addBtn) addBtn.disabled = true;

  var loadBar = document.getElementById('imgLoadBar');
  if (loadBar) loadBar.style.display = 'block';

  var queue = Array.prototype.slice.call(files);
  var total = queue.length;
  var done  = 0;

  function nextFile() {
    if (!queue.length) {
      if (loadBar) loadBar.style.display = 'none';
      if (addBtn) addBtn.disabled = false;
      return;
    }
    var file = queue.shift();
    compressAndUpload(file, function(err, imgObj) {
      done++;
      if (!err && imgObj) {
        driveImages.push(imgObj);
        viewImgIdx = driveImages.length - 1;
        updateImgStrip();
      }
      nextFile();
    });
  }
  nextFile();
}

function compressAndUpload(file, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      // Compress: max 1200px on longest side, JPEG quality 0.82
      var MAX = 1200;
      var w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else       { w = Math.round(w * MAX / h); h = MAX; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      var base64  = dataUrl.split(',')[1];
      var mimeType= 'image/jpeg';
      var ts = new Date().toISOString().replace(/[-:T]/g,'').slice(0,14);
      var fileName = currentItem.id + '_' + ts + '.jpg';

      if (!WEBAPP_URL || DEMO_MODE) {
        // Demo: just show locally with dataURL
        cb(null, { id:'', name:fileName, thumb:dataUrl, url:dataUrl });
        return;
      }

      apiPost({
        action: 'uploadImage',
        itemId: currentItem.id,
        fileName: fileName,
        base64Data: base64,
        mimeType: mimeType
      }, function(err, data) {
        if (err) { alert('上傳失敗：'+err); cb(err); return; }
        // 若目前品項尚無封面，更新 cache 讓卡片刷新後顯示新圖
        if (!currentItem.coverThumb && data.thumb) {
          currentItem.coverThumb = data.thumb;
          var cIdx = dataCache.items.findIndex(function(i){return i.id===currentItem.id;});
          if (cIdx >= 0) dataCache.items[cIdx].coverThumb = data.thumb;
        }
        cb(null, { id:data.id, name:data.name, thumb:data.thumb, url:data.url });
      });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveEdit(){
  var newVals={};
  document.querySelectorAll('[data-key]').forEach(function(el){
    newVals[el.getAttribute('data-key')]=el.value;
  });
  var changed=[];
  Object.keys(newVals).forEach(function(k){if(currentItem[k]!==newVals[k])changed.push(k);});
  if (changed.length===0){editMode=false;renderPanel();return;}

  var saveBtn=document.getElementById('saveBtn');
  if(saveBtn){saveBtn.disabled=true;saveBtn.querySelector('span:last-child').textContent='儲存中⋯';}
  showSaving();

  var patch={};
  changed.forEach(function(k){patch[k]=newVals[k];});

  function applyLocally(){
    changed.forEach(function(k){currentItem[k]=newVals[k];});
    changedKeys=changed;
    var savedId=currentItem.id;
    var idx=dataCache.items.findIndex(function(i){return i.id===savedId;});
    if(idx>=0)dataCache.items[idx]=currentItem;
    editMode=false;
    hideSaving();
    renderPanel();

      var card=document.querySelector('.card[data-id="'+savedId+'"]');
      if(card){card.classList.add('card-saved');setTimeout(function(){card.classList.remove('card-saved');},1200);}
    },50);
  }

  if (DEMO_MODE || !WEBAPP_URL) {
    applyLocally();
    return;
  }

  apiPost({action:'update', id:currentItem.id, item:patch}, function(err){
    if (err) { hideSaving(); alert('儲存失敗：'+err); if(saveBtn){saveBtn.disabled=false;saveBtn.querySelector('span:last-child').textContent='儲存變更';} return; }
    applyLocally();
  });
}

// 核心繪製函數（單張）：畫好後以 callback 回傳 canvas
function drawLabelCanvas(item, cb) {
  var S = 10, W_MM = 68, H_MM = 24;
  var W = W_MM * S, H = H_MM * S;
  var QR_MM = 24, STRIP_MM = 11;
  var CTR_X = QR_MM * S;
  var CTR_W = (W_MM - QR_MM - STRIP_MM) * S;
  var STRIP_X = (W_MM - STRIP_MM) * S;

  var canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d');

  // 背景
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // 右側深色條
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(STRIP_X, 0, STRIP_MM * S, H);

  // 右側旋轉文字
  ctx.save();
  ctx.translate(STRIP_X + (STRIP_MM * S) / 2, H / 2);
  ctx.rotate(Math.PI / 2);
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + (2.8 * S) + 'px "Noto Sans TC", sans-serif';
  ctx.fillText(item.id, 0, -(2.3 * S));
  ctx.fillText('位置：' + (item.loc || ''), 0, (2.3 * S));
  ctx.restore();

  // ── 中央文字區（加裁切，任何文字不超出邊界）──
  var cMidX = CTR_X + CTR_W / 2;
  var maxW   = CTR_W - 2 * S;   // 可用寬度（留 1mm 邊）
  ctx.save();
  ctx.beginPath();
  ctx.rect(CTR_X + S * 0.5, S * 0.5, CTR_W - S, H - S);
  ctx.clip();

  // 朝代：小斜體，自動縮小直到兩行能容納
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var dynFs = 2.4 * S;
  var dynasty = item.dynasty || '';
  var dynEndY = S * 0.5;  // 預設頂部

  if (dynasty) {
    ctx.font = 'italic ' + dynFs + 'px "Noto Serif TC", serif';
    if (ctx.measureText(dynasty).width <= maxW) {
      // 單行
      ctx.fillText(dynasty, cMidX, H * 0.20);
      dynEndY = H * 0.20 + dynFs * 0.7;
    } else {
      // 折兩行：縮字直到每半行都能放進去
      var dMid = Math.ceil(dynasty.length / 2);
      var dp1 = dynasty.slice(0, dMid), dp2 = dynasty.slice(dMid);
      while (dynFs > 1.5 * S &&
             (ctx.measureText(dp1).width > maxW || ctx.measureText(dp2).width > maxW)) {
        dynFs -= 0.1 * S;
        ctx.font = 'italic ' + dynFs + 'px "Noto Serif TC", serif';
      }
      var dy1 = H * 0.14, dy2 = dy1 + dynFs * 1.45;
      ctx.fillText(dp1, cMidX, dy1);
      ctx.fillText(dp2, cMidX, dy2);
      dynEndY = dy2 + dynFs * 0.7;
    }
  }

  // 品名：粗體，盡量大，超寬時折兩行並同步縮字
  ctx.fillStyle = '#000000';
  var name = item.name || '';
  var nfs = 6 * S;
  ctx.font = 'bold ' + nfs + 'px "Noto Serif TC", serif';
  while (ctx.measureText(name).width > maxW && nfs > 2.5 * S) {
    nfs -= 0.25 * S;
    ctx.font = 'bold ' + nfs + 'px "Noto Serif TC", serif';
  }
  if (ctx.measureText(name).width > maxW) {
    // 折兩行，並縮字直到每半行都能放進去
    var mid = Math.ceil(name.length / 2);
    var np1 = name.slice(0, mid), np2 = name.slice(mid);
    nfs = Math.min(nfs, 3.8 * S);
    ctx.font = 'bold ' + nfs + 'px "Noto Serif TC", serif';
    while (nfs > 2 * S &&
           (ctx.measureText(np1).width > maxW || ctx.measureText(np2).width > maxW)) {
      nfs -= 0.15 * S;
      ctx.font = 'bold ' + nfs + 'px "Noto Serif TC", serif';
    }
    var availH = H - dynEndY - S;
    var ny1 = dynEndY + availH * 0.35;
    var ny2 = dynEndY + availH * 0.75;
    ctx.fillText(np1, cMidX, ny1);
    ctx.fillText(np2, cMidX, ny2);
  } else {
    // 單行：垂直置中於朝代底部到底邊
    var nameY = dynEndY + (H - dynEndY) / 2;
    ctx.fillText(name, cMidX, nameY);
  }

  ctx.restore();  // 解除裁切

  // 分隔線
  ctx.strokeStyle = 'rgba(26,22,18,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(CTR_X, 3 * S); ctx.lineTo(CTR_X, H - 3 * S);
  ctx.stroke();

  // QR code（非同步）
  var qrDiv = document.createElement('div');
  qrDiv.style.cssText = 'position:absolute;left:-9999px';
  document.body.appendChild(qrDiv);
  var netlifyUrl = window.location.origin + window.location.pathname;
  var qrUrl = netlifyUrl + '?id=' + encodeURIComponent(item.id);
  var qrSize = QR_MM * S;
  new QRCode(qrDiv, {text:qrUrl, width:qrSize, height:qrSize, colorDark:'#000000', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
  setTimeout(function() {
    var qrImg = qrDiv.querySelector('img') || qrDiv.querySelector('canvas');
    if (qrImg) {
      var doDraw = function() { ctx.drawImage(qrImg, 0, 0, qrSize, qrSize); qrDiv.remove(); cb(canvas); };
      if (qrImg.tagName === 'IMG' && !qrImg.complete) { qrImg.onload = doDraw; } else { doDraw(); }
    } else { qrDiv.remove(); cb(canvas); }
  }, 80);
}

function exportBatchCsv() {
  var selectedItems = dataCache.items.filter(function(i){ return batchSelected.has(i.id); });

  var baseUrl = window.location.origin + window.location.pathname;
  var rows = [['url','dynasty','name','id','loc']];
  selectedItems.forEach(function(item) {
    var url = baseUrl + '?id=' + encodeURIComponent(item.id);
    rows.push([
      url,
      item.dynasty || '',
      item.name    || '',
      item.id      || '',
      item.loc     || ''
    ]);

  var csv = rows.map(function(r){
    return r.map(function(v){
      var s = String(v).replace(/"/g,'""');
      return (s.indexOf(',')>=0 || s.indexOf('"')>=0 || s.indexOf('\n')>=0) ? '"'+s+'"' : s;
    }).join(',');
  }).join('\r\n');
  var blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.download = '典藏標籤_' + selectedItems.length + '件.csv';
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

function wrapText(ctx, text, maxWidth) {
  if (!text) return [''];
  var words = text.split('');
  var lines = [];
  var cur   = '';
  words.forEach(function(ch){
    var test = cur + ch;
    if (ctx.measureText(test).width > maxWidth && cur.length > 0) {
      lines.push(cur);
      cur = ch;
    } else {
      cur = test;
    }
  });
  if (cur) lines.push(cur);
  return lines;
}
