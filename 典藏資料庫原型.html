// 累加照片：選取時立即壓縮，同時存入預覽與上傳用陣列
function addPhotos(files) {
  if (!files || !files.length) return;
  if (!FS.photoFiles)      FS.photoFiles      = [];
  if (!FS.photoPreviewUrls)FS.photoPreviewUrls = [];
  if (!FS.photoCompressed) FS.photoCompressed  = [];
  var pending = files.length;
  files.forEach(function(f){
    FS.photoFiles.push(f);
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        // 壓縮：長邊最大 1200px, JPEG 0.82
        var MAX=1200, w=img.width, h=img.height;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        var compressed = c.toDataURL('image/jpeg', 0.82);
        FS.photoPreviewUrls.push(compressed);  // 預覽用
        FS.photoCompressed.push(compressed);   // 上傳用（已壓縮）
        pending--;
        if(pending===0){ FS.photo=true; FS.aiDone=false; renderFile(); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

function triggerAiRecognition() {
  if (FS.aiLoad || FS.aiDone) return;
  // 優先用已壓縮的版本，沒有就檢查原始 File
  var base64 = null;
  if (FS.photoCompressed && FS.photoCompressed.length) {
    base64 = FS.photoCompressed[0].split(',')[1];
    doRecognize(base64);
  } else if (FS.photoFiles && FS.photoFiles.length) {
    // fallback：即時壓縮
    var reader = new FileReader();
    reader.onload = function(e){
      var img2 = new Image();
      img2.onload = function(){
        var MAX=1200, w=img2.width, h=img2.height;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img2,0,0,w,h);
        doRecognize(c.toDataURL('image/jpeg',0.85).split(',')[1]);
      };
      img2.src = e.target.result;
    };
    reader.readAsDataURL(FS.photoFiles[0]);
  } else {
    return; // 沒有照片
  }

  function doRecognize(b64) {
    if (DEMO_MODE || !WEBAPP_URL) {
      FS.aiLoad = true; renderFile();
      setTimeout(function(){ FS.aiLoad=false; FS.aiDone=true; renderFile(); }, 1200);
      return;
    }
    FS.aiLoad = true;
    if (FS.step === 4) renderFile(); // 立即顯示 spinner
    apiPost({action:'recognize', base64Data:b64, mimeType:'image/jpeg', cat:FS.cat}, function(err, data){
      FS.aiLoad = false;
      if (err) {
        FS.aiDone = false;
        alert('AI 辨識失敗：' + err);
      } else {
        FS.dynasty = data.dynasty || '';
        FS.kiln    = data.kiln    || '';
        FS.craft   = data.craft   || '';
        FS.desc    = data.desc    || '';
        FS.aiDone  = true;
      }
      if (FS.step === 4) renderFile();
    });
  }
}

function doSave(cb) {
  var ai=AI_MOCK[FS.cat]||AI_MOCK.CQ;
  var newItem = {
    loc:FS.loc, name:FS.name||'（未命名）',
    dynasty:FS.dynasty||ai.dynasty, kiln:FS.kiln||ai.kiln,
    craft:FS.craft||ai.craft, size:FS.size,
    cond:FS.cond||(COND_OPTS[FS.cat]||COND_OPTS.CQ)[0],
    desc:FS.desc||ai.desc, price:FS.price, note:FS.note,
  };

  if (DEMO_MODE || !WEBAPP_URL) {
    // 離線模式：本地產生 ID
    var d=new Date(),roc=d.getFullYear()-1911,mm=('0'+(d.getMonth()+1)).slice(-2),dd2=('0'+d.getDate()).slice(-2);
    var prefix=FS.cat+'-'+roc+mm+dd2+'-';
    var cnt=dataCache.items.filter(function(i){return i.id.indexOf(prefix)===0;}).length;
    FS.newId = prefix+('00'+(cnt+1)).slice(-3);
    FS.newFolderUrl = '';
    var localItem = Object.assign({}, newItem, {
      id:FS.newId, cat:FS.cat,
      color:CAT_COLORS[FS.cat], emoji:CATS[FS.cat].e,
      images:[CATS[FS.cat].e,CATS[FS.cat].e,CATS[FS.cat].e],
      folderId:'', folderUrl:'', isNew:true,
    });
    dataCache.items.push(localItem);
    cb(null);
    return;
  }

  showSaving('建檔中⋯');
  apiPost({action:'create', cat:FS.cat, item:newItem}, function(err, data){
    if (err) { hideSaving(); cb(err); return; }
    FS.newId       = data.id;
    FS.newFolderId = data.folderId || '';
    FS.newFolderUrl= data.folderUrl || '';
    var localItem = Object.assign({}, newItem, {
      id:data.id, cat:FS.cat,
      color:CAT_COLORS[FS.cat], emoji:CATS[FS.cat].e,
      images:[CATS[FS.cat].e],
      folderId:data.folderId||'', folderUrl:data.folderUrl||'', isNew:true,
    });
    dataCache.items.push(localItem);

    // 並行上傳所有圖片（已在選照片時壓縮完畢）
    var compressed = FS.photoCompressed || [];
    if (!compressed.length) { hideSaving(); cb(null); return; }

    var total    = compressed.length;
    var done     = 0;
    var ts       = new Date().toISOString().replace(/[-:T]/g,'').slice(0,14);
    showSaving('上傳圖片（0/'+total+'）⋯');

    compressed.forEach(function(dataUrl, i){
      var base64   = dataUrl.split(',')[1];
      var fileName = data.id+'_'+ts+'_'+('0'+(i+1)).slice(-2)+'.jpg';
      apiPost({action:'uploadImage',itemId:data.id,fileName:fileName,base64Data:base64,mimeType:'image/jpeg'}, function(e2, imgData){
        done++;
        // 第一張回來就更新卡片封面
        if (i===0 && imgData && imgData.thumb) {
          var newIdx = dataCache.items.findIndex(function(it){return it.id===data.id;});
          if (newIdx >= 0) dataCache.items[newIdx].coverThumb = imgData.thumb;
        }
        showSaving('上傳圖片（'+done+'/'+total+'）⋯');
        if (done === total) { hideSaving(); cb(null); }
      });
    });
  });
}

function bindFileClicks(){
  function on(id,fn){var el=document.getElementById(id);if(el)el.addEventListener('click',fn);}
  Object.keys(CATS).forEach(function(k){on('fcat_'+k,function(){FS.cat=k;renderFile();});});
  on('fNext1',function(){if(FS.cat)fGo(2);});
  on('fBack2',function(){fGo(1);});
  on('fClearPos',function(){FS.selCab=null;FS.selLayer=null;FS.loc='';renderFile();});
  on('fNext2',function(){
    var nm=document.getElementById('fn');if(!FS.loc)return;
    if(nm&&!nm.value.trim()){nm.style.borderColor='var(--accent)';nm.focus();return;}
    FS.name=(nm?nm.value.trim():'');
    FS.size=(document.getElementById('fsz')?document.getElementById('fsz').value:'');
    FS.cond=(document.getElementById('fcd')?document.getElementById('fcd').value:'');
    fGo(3);
  });
  on('fBack3',function(){fGo(2);});
  // 建檔第3步：點擊上傳區（空白時）或「新增」按鈕
  on('fUploadZone', function(e){
    // 若點到刪除按鈕，處理刪除
    var rmBtn = e.target.closest ? e.target.closest('[data-rmidx]') : null;
    if (rmBtn) {
      var idx = parseInt(rmBtn.getAttribute('data-rmidx'));
      FS.photoFiles.splice(idx, 1);
      if (FS.photoPreviewUrls) FS.photoPreviewUrls.splice(idx, 1);
      FS.photo = FS.photoFiles.length > 0;
      FS.aiDone = false;
      renderFile();
      return;
    }
    // 若點到「繼續新增」按鈕
    var addBtn = e.target.closest ? e.target.closest('#fAddMoreBtn') : null;
    if (addBtn) { var fi2=document.getElementById('fPhotoInput'); if(fi2)fi2.click(); return; }
    // 空白區點擊 → 選檔
    if (!FS.photoFiles || FS.photoFiles.length === 0) {
      var fi=document.getElementById('fPhotoInput'); if(fi)fi.click();
    }
  });
  // 拖曳上傳
  (function(){
    var zone = document.getElementById('fUploadZone');
    if (zone) {
      zone.addEventListener('dragover', function(e){ e.preventDefault(); e.stopPropagation(); zone.classList.add('drag-over-file'); });
      zone.addEventListener('dragleave', function(e){ if(!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over-file'); });
      zone.addEventListener('drop', function(e){
        e.preventDefault(); e.stopPropagation(); zone.classList.remove('drag-over-file');
        var files = Array.prototype.slice.call(e.dataTransfer.files).filter(function(f){ return f.type.indexOf('image/')===0; });
        if (!files.length) return;
        addPhotos(files);
      });
    }
  })();
  // 檔案 input 變更 → 累加
  (function(){
    var fi=document.getElementById('fPhotoInput');
    if(fi){fi.onchange=function(){
      var files=Array.prototype.slice.call(this.files);
      addPhotos(files);
      this.value=''; // 清空 input，讓同樣的檔案下次還能觸發
    };}
  })();
  on('fNext3',function(){fGo(4);});
  on('fBack4',function(){fGo(3);});
  on('fAiBtn',function(){ triggerAiRecognition(); }); // 手動重試按鈕
  on('fNext4',function(){
    if(document.getElementById('aid'))FS.dynasty=document.getElementById('aid').value;
    if(document.getElementById('aik'))FS.kiln=document.getElementById('aik').value;
    if(document.getElementById('aic'))FS.craft=document.getElementById('aic').value;
    if(document.getElementById('aidc'))FS.desc=document.getElementById('aidc').value;
    if(document.getElementById('fpr'))FS.price=document.getElementById('fpr').value;
    if(document.getElementById('fnt'))FS.note=document.getElementById('fnt').value;
    fGo(5);
  });
  on('fBack5',function(){fGo(4);});
  on('fSave',function(){
    // 讀取 step5 可編輯欄位
    var g=function(id){var el=document.getElementById(id);return el?el.value.trim():null;};
    if(g('s5name')!==null)   FS.name    = g('s5name');
    if(g('s5dynasty')!==null)FS.dynasty = g('s5dynasty');
    if(g('s5kiln')!==null)   FS.kiln    = g('s5kiln');
    if(g('s5craft')!==null)  FS.craft   = g('s5craft');
    if(g('s5size')!==null)   FS.size    = g('s5size');
    if(g('s5cond')!==null)   FS.cond    = g('s5cond');
    if(g('s5price')!==null)  FS.price   = g('s5price');
    if(g('s5desc')!==null)   FS.desc    = g('s5desc');
    var btn=document.getElementById('fSave');if(btn)btn.disabled=true;
    doSave(function(err){
      if(err){alert('建檔失敗：'+err);if(btn)btn.disabled=false;return;}
      fGo(6);
      // 2 秒後自動跳到詳細頁
      setTimeout(function(){
        if(FS.newId){ currentCat=FS.cat; switchMode('browse'); setTimeout(function(){openDetail(FS.newId);},100); }
      }, 2000);
    });
  });
  on('fViewBtn',function(){
    currentCat=FS.cat;
    switchMode('browse');
    setTimeout(function(){openDetail(FS.newId);},100);
  });
  on('fResetBtn',function(){
    FS={step:1,cat:'',photo:false,photoFiles:[],photoPreviewUrls:[],photoCompressed:[],aiDone:false,aiLoad:false,selCab:null,selLayer:null,loc:'',name:'',size:'',cond:'',dynasty:'',kiln:'',craft:'',desc:'',price:'',note:'',newId:'',newFolderId:'',newFolderUrl:''};
    renderFile();
  });
  document.querySelectorAll('[data-cab]').forEach(function(el){
    el.addEventListener('click',function(){FS.selCab=this.getAttribute('data-cab');FS.selLayer=null;FS.loc='';renderFile();});
  });
  document.querySelectorAll('[data-layer]').forEach(function(el){
    el.addEventListener('click',function(){FS.selLayer=parseInt(this.getAttribute('data-layer'));FS.loc=FS.selCab+'-'+FS.selLayer;renderFile();});
  });
}

function fGo(n){FS.step=n;renderFile();}

/* ========== QUICK FILE (手機快拍建檔) ========== */

var QFS = {
  photos:[], mainIdx:0,
  cat:'', loc:'', name:'', cond:'', dynasty:'', kiln:'', craft:'', desc:'', price:'', note:'',
  aiDone:false, aiLoad:false, locOpen:false, selCab:null, selLayer:null,
};

// ── 開啟相機 ──
document.getElementById('camFab').onclick = function(){
  document.getElementById('quickCamInput').click();
};

document.getElementById('quickCamInput').onchange = function(){
  var files = Array.prototype.slice.call(this.files);
  if (!files.length) return;
  this.value = '';
  // 壓縮並加入照片
  var pending = files.length;
  files.forEach(function(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var MAX=1600, w=img.width, h=img.height;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        var dataUrl=c.toDataURL('image/jpeg',0.85);
        QFS.photos.push({dataUrl:dataUrl, fileName:file.name});
        QFS.mainIdx = QFS.photos.length - 1;
        pending--;
        if(pending===0) openQfSheet();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
};

function openQfSheet(){
  document.getElementById('qfBackdrop').classList.add('open');
  document.getElementById('qfSheet').classList.add('open');
  renderQf();
}

function closeQfSheet(){
  document.getElementById('qfBackdrop').classList.remove('open');
  document.getElementById('qfSheet').classList.remove('open');
  QFS={photos:[],mainIdx:0,cat:'',loc:'',name:'',cond:'',dynasty:'',kiln:'',craft:'',desc:'',price:'',note:'',aiDone:false,aiLoad:false,locOpen:false,selCab:null,selLayer:null};
}

document.getElementById('qfBackdrop').onclick = closeQfSheet;
document.getElementById('qfClose').onclick    = closeQfSheet;
document.getElementById('qfCancel').onclick   = closeQfSheet;

// ── 渲染底部表單 ──
function renderQf(){
  var body = document.getElementById('qfBody');
  if (!body) return;

  // 照片區
  var photoHtml = '<div class="qf-photos" id="qfMainPhoto">';
  if (QFS.photos.length > 0) {
    photoHtml += '<img src="'+QFS.photos[QFS.mainIdx].dataUrl+'" alt="">';
    if (QFS.photos.length > 1) {
      photoHtml += '<button class="qf-photo-nav prev" id="qfPrev">‹</button>'
                 + '<button class="qf-photo-nav next" id="qfNext">›</button>';
    }
    photoHtml += '<span class="qf-photo-counter">'+(QFS.mainIdx+1)+' / '+QFS.photos.length+'</span>';
  } else {
    photoHtml += '<span class="qf-ph-empty">📷</span>';
  }
  photoHtml += '</div>';

  // 縮圖列
  var thumbHtml = '<div class="qf-thumbs">';
  QFS.photos.forEach(function(p,i){
    thumbHtml += '<div class="qf-thumb'+(i===QFS.mainIdx?' active':'')+'" data-qfi="'+i+'"><img src="'+p.dataUrl+'"></div>';
  });
  thumbHtml += '<button class="qf-thumb-add" id="qfAddPhoto"><span>＋</span><span>再拍</span></button></div>';

  // 表單
  var condOpts = COND_OPTS[QFS.cat] || COND_OPTS.CQ;
  var lbl = CAT_FIELD_LABELS[QFS.cat] || CAT_FIELD_LABELS.CQ;

  var catsHtml = '<div class="qf-sec first">選擇分類</div><div class="qf-cats">'
    + Object.keys(CATS).map(function(k){
        return '<div class="qf-cat'+(QFS.cat===k?' sel':'')+'" data-qfcat="'+k+'">'
          +'<div class="qf-cat-e">'+CATS[k].e+'</div>'
          +'<div class="qf-cat-k">'+k+'</div>'
          +'<div class="qf-cat-n">'+CATS[k].n+'</div></div>';
      }).join('') + '</div>';

  // 位置
  var locHtml = '<div class="qf-sec">存放位置</div>'
    + '<div class="qf-fg"><div class="qf-loc-row">'
    + '<input class="ffi" id="qfLocInput" placeholder="如 L-01-A-2 或 R-03-1" value="'+escHtml(QFS.loc)+'">'
    + '<button class="qf-loc-btn'+(QFS.locOpen?' sel':'')+'" id="qfLocToggle">'+(QFS.locOpen?'收起':'平面圖')+'</button>'
    + '</div></div>';

  if (QFS.locOpen) {
    locHtml += '<div class="qf-locpicker" id="qfLocPicker">' + fpHtml() + layerHtml() + '</div>';
    if (QFS.loc) locHtml = '<div class="qf-sec">存放位置</div>' + posResultHtml()
      + '<div style="text-align:right;margin-bottom:8px"><span style="font-size:11px;color:var(--ink3);cursor:pointer;text-decoration:underline" id="qfClearPos">重新選擇</span></div>';
  }

  // 基本資料
  var basicHtml = '<div class="qf-sec">基本資料</div>'
    + '<div class="qf-fg"><div class="qf-lbl">品項名稱 <span class="req">＊</span></div><input class="ffi" id="qfName" placeholder="請填入品項名稱" value="'+escHtml(QFS.name)+'"></div>'
    + '<div class="qf-row">'
    + '<div class="qf-fg"><div class="qf-lbl">品像</div><select class="ffi" id="qfCond"><option value="">請選擇</option>'+condOpts.map(function(o){return '<option'+(QFS.cond===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select></div>'
    + '<div class="qf-fg"><div class="qf-lbl">尺寸</div><input class="ffi" id="qfSize" placeholder="口徑/高 (cm)" value="'+escHtml(QFS.size||'')+'"></div>'
    + '</div>';

  // AI 辨識
  var aiHtml = '<div class="qf-sec">AI 辨識</div>';
  if (QFS.aiLoad) {
    aiHtml += '<div style="text-align:center;padding:20px"><div class="spinner"></div><div style="font-size:11px;color:var(--ink3);letter-spacing:2px;margin-top:6px">AI 辨識中⋯</div></div>';
  } else if (!QFS.aiDone) {
    var photoReady = QFS.photos.length > 0;
    aiHtml += '<div class="qf-ai-bar" id="qfAiBtn">'
      + '<div><div class="qf-ai-lbl">✦ 開始 AI 辨識</div>'
      + '<div class="qf-ai-hint">'+(photoReady?'辨識'+lbl.f2+'、'+lbl.f3+'、'+lbl.f4+'、紋飾描述':'請先選擇分類')+'</div></div>'
      + '<span style="font-size:20px;opacity:.4">›</span></div>';
  } else {
    var aiMock = AI_MOCK[QFS.cat] || AI_MOCK.CQ;
    aiHtml += '<div class="qf-ai-fields"><div class="qf-form-inner">'
      + '<div class="qf-row" style="margin-bottom:10px">'
      + '<div class="qf-fg"><div class="qf-lbl">'+lbl.f2+' <span style="font-size:9px;color:var(--jade);background:rgba(61,122,94,0.1);padding:1px 5px;border-radius:8px">✦ AI</span></div><input class="ffi qf-aif" id="qfDynasty" value="'+escHtml(QFS.dynasty||aiMock.dynasty)+'"></div>'
      + '<div class="qf-fg"><div class="qf-lbl">'+lbl.f3+' <span style="font-size:9px;color:var(--jade);background:rgba(61,122,94,0.1);padding:1px 5px;border-radius:8px">✦ AI</span></div><input class="ffi qf-aif" id="qfKiln" value="'+escHtml(QFS.kiln||aiMock.kiln)+'"></div>'
      + '</div>'
      + '<div class="qf-fg" style="margin-bottom:10px"><div class="qf-lbl">'+lbl.f4+' <span style="font-size:9px;color:var(--jade);background:rgba(61,122,94,0.1);padding:1px 5px;border-radius:8px">✦ AI</span></div><input class="ffi qf-aif" id="qfCraft" value="'+escHtml(QFS.craft||aiMock.craft)+'"></div>'
      + '<div class="qf-fg"><div class="qf-lbl">簡述 <span style="font-size:9px;color:var(--jade);background:rgba(61,122,94,0.1);padding:1px 5px;border-radius:8px">✦ AI</span></div><textarea class="ffi qf-aif" id="qfDesc" style="min-height:80px">'+escHtml(QFS.desc||aiMock.desc)+'</textarea></div>'
      + '</div></div>';
  }

  // 參考價 / 備註
  var extraHtml = '<div class="qf-sec">其他資訊</div>'
    + '<div class="qf-row">'
    + '<div class="qf-fg"><div class="qf-lbl">參考價</div><input class="ffi" id="qfPrice" placeholder="NT$ ..." value="'+escHtml(QFS.price)+'"></div>'
    + '<div class="qf-fg"><div class="qf-lbl">備註</div><input class="ffi" id="qfNote" placeholder="補充說明" value="'+escHtml(QFS.note)+'"></div>'
    + '</div><div style="height:8px"></div>';

  body.innerHTML = photoHtml + thumbHtml + '<div class="qf-form">' + catsHtml + locHtml + basicHtml + aiHtml + extraHtml + '</div>';

  // 更新儲存按鈕狀態
  var saveBtn = document.getElementById('qfSaveBtn');
  if (saveBtn) saveBtn.disabled = !QFS.cat || !QFS.loc;

  bindQf();
}

function bindQf(){
  function on(id,fn){var el=document.getElementById(id);if(el)el.addEventListener('click',fn);}

  // 縮圖切換
  document.querySelectorAll('.qf-thumb[data-qfi]').forEach(function(el){
    el.onclick=function(){QFS.mainIdx=parseInt(this.getAttribute('data-qfi'));renderQf();};
  });

  // 大圖左右
  on('qfPrev',function(e){e.stopPropagation();QFS.mainIdx=(QFS.mainIdx-1+QFS.photos.length)%QFS.photos.length;renderQf();});
  on('qfNext',function(e){e.stopPropagation();QFS.mainIdx=(QFS.mainIdx+1)%QFS.photos.length;renderQf();});

  // 再拍 / 補圖
  on('qfAddPhoto',function(){
    var inp=document.getElementById('quickCamInput');
    if(inp){inp.removeAttribute('capture');inp.click();inp.setAttribute('capture','environment');}
  });

  // 分類選擇
  document.querySelectorAll('[data-qfcat]').forEach(function(el){
    el.onclick=function(){QFS.cat=this.getAttribute('data-qfcat');QFS.aiDone=false;renderQf();};
  });

  // 位置：平面圖切換
  on('qfLocToggle',function(){QFS.locOpen=!QFS.locOpen;_qfSaveFields();renderQf();});
  on('qfClearPos',function(){QFS.loc='';QFS.selCab=null;QFS.selLayer=null;_qfSaveFields();renderQf();});

  // 平面圖點選（reuse existing cab/layer cells）
  document.querySelectorAll('[data-cab]').forEach(function(el){
    el.onclick=function(){QFS.selCab=this.getAttribute('data-cab');QFS.selLayer=null;QFS.loc='';_qfSaveFields();renderQf();};
  });
  document.querySelectorAll('[data-layer]').forEach(function(el){
    el.onclick=function(){QFS.selLayer=parseInt(this.getAttribute('data-layer'));QFS.loc=QFS.selCab+'-'+QFS.selLayer;_qfSaveFields();renderQf();};
  });

  // AI 辨識
  on('qfAiBtn',function(){
    if(!QFS.cat){alert('請先選擇分類');return;}
    if(!QFS.photos.length){alert('請先拍攝至少一張照片');return;}
    _qfSaveFields();
    QFS.aiLoad=true;renderQf();

    if(DEMO_MODE||!WEBAPP_URL){
      setTimeout(function(){QFS.aiLoad=false;QFS.aiDone=true;renderQf();},1800);
      return;
    }

    // 用第一張照片（已壓縮 dataUrl）做辨識
    var base64=QFS.photos[0].dataUrl.split(',')[1];
    apiPost({action:'recognize',base64Data:base64,mimeType:'image/jpeg',cat:QFS.cat},function(err,data){
      QFS.aiLoad=false;
      if(err){alert('AI辨識失敗：'+err);QFS.aiDone=false;renderQf();return;}
      QFS.dynasty=data.dynasty||'';QFS.kiln=data.kiln||'';QFS.craft=data.craft||'';QFS.desc=data.desc||'';
      QFS.aiDone=true;renderQf();
    });
  });

  // 位置輸入即時更新
  var locInp=document.getElementById('qfLocInput');
  if(locInp){locInp.addEventListener('input',function(){QFS.loc=this.value.trim();var s=document.getElementById('qfSaveBtn');if(s)s.disabled=!QFS.cat||!QFS.loc;});}

  // 儲存
  var saveBtn=document.getElementById('qfSaveBtn');
  if(saveBtn){saveBtn.onclick=function(){_qfSaveFields();qfDoSave();};}
}

function _qfSaveFields(){
  function v(id){var el=document.getElementById(id);return el?el.value:'';}
  if(document.getElementById('qfLocInput'))QFS.loc=v('qfLocInput')||QFS.loc;
  QFS.name    = v('qfName')    || QFS.name;
  QFS.cond    = v('qfCond')    || QFS.cond;
  QFS.size    = v('qfSize')    || QFS.size;
  QFS.dynasty = v('qfDynasty') || QFS.dynasty;
  QFS.kiln    = v('qfKiln')    || QFS.kiln;
  QFS.craft   = v('qfCraft')   || QFS.craft;
  QFS.desc    = v('qfDesc')    || QFS.desc;
  QFS.price   = v('qfPrice')   || QFS.price;
  QFS.note    = v('qfNote')    || QFS.note;
}

function qfDoSave(){
  _qfSaveFields();
  if (!QFS.cat) { alert('請選擇分類'); return; }
  if (!QFS.loc) { alert('請填入存放位置'); return; }
  if (!QFS.name.trim()) { alert('請填入品項名稱'); return; }

  var saveBtn = document.getElementById('qfSaveBtn');
  if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='儲存中⋯';}

  var ai = AI_MOCK[QFS.cat] || AI_MOCK.CQ;
  var newItem = {
    loc: QFS.loc, name: QFS.name,
    dynasty: QFS.dynasty||ai.dynasty, kiln: QFS.kiln||ai.kiln,
    craft: QFS.craft||ai.craft, size: QFS.size||'',
    cond: QFS.cond||(COND_OPTS[QFS.cat]||COND_OPTS.CQ)[0],
    desc: QFS.desc||ai.desc, price: QFS.price, note: QFS.note,
  };

  function afterCreate(itemId, folderId) {
    var photos = QFS.photos.slice();
    if (!photos.length) { _qfFinish(itemId); return; }
    showSaving('上傳圖片（0/'+photos.length+'）⋯');
    var uploaded=0;
    function nextPhoto(){
      if(!photos.length){hideSaving();_qfFinish(itemId);return;}
      var p=photos.shift();
      var base64=p.dataUrl.split(',')[1];
      var ts=new Date().toISOString().replace(/[-:T]/g,'').slice(0,14);
      var fn=itemId+'_'+ts+'_'+('0'+(uploaded+1)).slice(-2)+'.jpg';
      apiPost({action:'uploadImage',itemId:itemId,fileName:fn,base64Data:base64,mimeType:'image/jpeg'},function(err,data){
        uploaded++;
        if(!err&&data&&data.thumb&&uploaded===1){
          var cIdx=dataCache.items.findIndex(function(i){return i.id===itemId;});
          if(cIdx>=0)dataCache.items[cIdx].coverThumb=data.thumb;
        }
        showSaving('上傳圖片（'+uploaded+'/'+QFS.photos.length+'）⋯');
        nextPhoto();
      });
    }
    nextPhoto();
  }

  if(DEMO_MODE||!WEBAPP_URL){
    var d=new Date(),roc=d.getFullYear()-1911,mm=('0'+(d.getMonth()+1)).slice(-2),dd2=('0'+d.getDate()).slice(-2);
    var prefix=QFS.cat+'-'+roc+mm+dd2+'-';
    var cnt=dataCache.items.filter(function(i){return i.id.indexOf(prefix)===0;}).length;
    var newId=prefix+('00'+(cnt+1)).slice(-3);
    var localItem=Object.assign({},newItem,{
      id:newId,cat:QFS.cat,color:CAT_COLORS[QFS.cat],emoji:CATS[QFS.cat].e,
      images:[CATS[QFS.cat].e],folderId:'',folderUrl:'',
      coverThumb: QFS.photos.length?QFS.photos[0].dataUrl:'',isNew:true,
    });
    dataCache.items.push(localItem);
    _qfFinish(newId);
    return;
  }

  showSaving('建檔中⋯');
  apiPost({action:'create',cat:QFS.cat,item:newItem},function(err,data){
    hideSaving();
    if(err){alert('建檔失敗：'+err);if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='確認儲存';}return;}
    var localItem=Object.assign({},newItem,{
      id:data.id,cat:QFS.cat,color:CAT_COLORS[QFS.cat],emoji:CATS[QFS.cat].e,
      images:[CATS[QFS.cat].e],folderId:data.folderId||'',folderUrl:data.folderUrl||'',
      coverThumb:'',isNew:true,
    });
    dataCache.items.push(localItem);
    afterCreate(data.id, data.folderId);
  });
}

function _qfFinish(itemId){
  hideSaving();
  closeQfSheet();
  currentCat = QFS.cat || currentCat;
  renderBrowse('', true);
  // 短暫延遲後開啟詳細頁
  setTimeout(function(){
    switchMode('browse');
    openDetail(itemId);
  }, 150);
}
